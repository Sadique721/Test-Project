server.port=30083
app.name=/Savbillinventorymanagement
spring.datasource.url=jdbc:mysql://localhost:3306/savbillinventorymanagement?allowPublicKeyRetrieval=true&useSSL=false&autoreconnect=true&createDatabaseIfNotExist=true

spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL5InnoDBDialect
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog.main.xml
spring.mvc.view.suffix=.html
spring.http.multipart.max-file-size=10MB
spring.http.multipart.max-request-size=10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.com.savbill==DEBUG
logging.level.org.springframework=INFO
logging.level.root=INFO
#logging.level.org.hibernate.type=TRACE
logging.level.org.hibernate.SQL=ERROR
logging.level.org.springframework.jdbc.core=INFO
server.error.whitelabel.enabled=false
#spring.jpa.properties.org.hibernate.envers.default_schema=audit
spring.jpa.properties.hibernate.integration.envers.enabled=false
logging.level.org.springframework.transaction=Info
logging.level.org.springframework.transaction.interceptor=TRACE
spring.enable.scheduling=true
#cron job for the warrenty days update
cronJobTimeForwarrentydays = 59 23 * * * ?
#CRONJOB TIME (IN MINUTE) FOR IP RELEASE (IN EVERY 15 MINUTE)
cronjobtimeforiprelease=0 1 */3 * * *
#EVERYDAY CRONJOB TIME FOR IP RELEASE AT 12PM
#everydaycronjobtimeforiprelease=0 0 12 * * *
#cron job for OEM-Inward And OEM-Item warranty update (Every Day Midnight 23:55PM)
cronJobTimeForOemWarrantyDays=0 55 23 * * ?
cronJobTimeForUsedPortNotificationScheduler=0 40 23 * * ?
#0 */2 * * * *
#10 hours token
jwt.token.validity=36000000
jwt.secret=asdfSFS34wfsdfsdfSDSD32dfsddDDerQSNCK34SOWEK5354fdgdf4

management.endpoints.web.exposure.include=prometheus,metrics

javers.mappingStyle=FIELD
javers.algorithm=SIMPLE
javers.commitIdGenerator=synchronized_sequence
javers.prettyPrint=true
javers.typeSafeValues=false
javers.initialChanges=true
javers.terminalChanges=true
javers.packagesToScan=*
javers.auditableAspectEnabled=true
javers.springDataAuditableRepositoryAspectEnabled=true
#javers.objectAccessHook=""
javers.usePrimitiveDefaults=true
#javers.prettyPrintDateFormats=""
javers.localDateTime='dd MMM yyyy, HH:mm:ss'
javers.zonedDateTime='dd MMM yyyy, HH:mm:ssZ'
javers.localDate='dd MMM yyyy'
javers.localTime='HH:mm:ss'

javers.sqlSchema=savbillinventorymanagement
javers.sqlSchemaManagementEnabled=true
javers.sqlGlobalIdCacheDisabled=false
javers.objectAccessHook=org.javers.hibernate.integration.HibernateUnproxyObjectAccessHook
javers.sqlGlobalIdTableName=jv_global_id
javers.sqlCommitTableName=jv_commit
javers.sqlSnapshotTableName=jv_snapshot
javers.sqlCommitPropertyTableName=jv_commit_property

spring.profiles.active=kafka
#kafka.bootstrapAddress=127.0.0.1
#kafka.port=9092
kafka-url=127.0.0.1:9092
spring.kafka.consumer.max-attempts=3
max.poll.records=15000
fetch.max.bytes=524288000
fetch.min.bytes=1
kafka.max.request.size=2000000000

#spring.kafka.producer.bootstrap-servers= localhost:9092
#spring.kafka.topic.registeredTopic =SavbillApiGateWayCommon
#spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
#spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Configure the maximum number of attempts for retrying message processing
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.max-lifetime=1800000
