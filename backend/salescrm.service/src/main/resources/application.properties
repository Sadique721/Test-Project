#spring.datasource.url=jdbc:mysql://savbilldb:3306/savbillsalesscrms?autoreconnect = true&createDatabaseIfNotExist=true
spring.datasource.url=jdbc:mysql://localhost:3306/savbillsalesscrms?autoreconnect = true&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.liquibase.change-log=classpath:db/changelog/db.changelog.main.xml
spring.jpa.properties.org.hibernate.envers.default_schema=audit
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform = org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

management.endpoints.web.exposure.include=prometheus,metrics


#CRONJOB TIME (IN MINUTE) FOR (IN EVERY 5 MINUTE)
cronJobTimeForReminderFollowUp=0 1 */3 * * *

#CRONJOB TIME (IN MINUTE) FOR (IN EVERY 5 MINUTE)
cronJobTimeForOverDueFollowUp=0 1 */3 * * *

#CRONJOB TIME (IN MINUTE) FOR (IN EVERY 5 MINUTE)
cronJobTimeForNoLeadFollowUp=0 1 */3 * * *

#CRONJOB TIME (IN MINUTE) FOR (IN EVERY 5 MINUTE)
cronJobTimeForNoFollowUp=0 1 */3 * * *

#enable logging
logging.level.com.savbill.salescrmsbss=DEBUG
logging.level.org.hibernate.SQL=ERROR
logging.level.org.springframework.jdbc.core=INFO
server.error.whitelabel.enabled=false
logging.level.org.springframework.transaction=Info
logging.level.org.springframework.transaction.interceptor=TRACE

