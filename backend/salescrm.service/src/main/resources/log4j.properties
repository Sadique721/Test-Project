log4j.rootLogger=DEBUG, file
log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=log/savbill-salescrmsbss.log
log4j.appender.file.MaxFileSize=100MB
log4j.appender.file.MaxBackupIndex=10
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern={"level":"%p", "user":"%X{userName}", "trace-id":"%X{traceId}", "span-id":"%X{spanId}", "type":"%X{type}","timestamp":"%d{ISO8601}", "module":"Savbill-CRM-Management","thread":"%t","sub-module":"%F", "line":"%L","message":"%m"}%n


log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern={"level":"%p", "user":"%X{userName}", "trace-id":"%X{traceId}", "span-id":"%X{spanId}", "type":"%X{type}","timestamp":"%d{ISO8601}", "module":"Savbill-CRM-Management","thread":"%t","sub-module":"%F", "line":"%L","message":"%m"}%n


log4j.logger.wifilog=DEBUG, wifilog
log4j.additivity.wifilog=false
log4j.appender.wifilog=org.apache.log4j.RollingFileAppender
log4j.appender.wifilog.File=SavbillWifiServer.log
log4j.appender.wifilog.MaxFileSize=100MB
log4j.appender.wifilog.MaxBackupIndex=10
log4j.appender.wifilog.layout=org.apache.log4j.PatternLayout
log4j.appender.wifilog.layout.ConversionPattern={"level":"%p", "user":"%X{userName}", "trace-id":"%X{traceId}", "span-id":"%X{spanId}", "type":"%X{type}","timestamp":"%d{ISO8601}", "module":"Savbill-CRM-Management","thread":"%t","sub-module":"%F", "line":"%L","message":"%m"}%n

log4j.logger.io.swagger.models.parameters.AbstractSerializableParameter=error
