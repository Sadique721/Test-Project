plugins {
	id 'org.springframework.boot' version '2.3.11.RELEASE'
	id 'io.spring.dependency-management' version '1.0.11.RELEASE'
	id 'java'
	id 'org.sonarqube' version '3.1.1'
	id 'jacoco'
	id "com.ewerk.gradle.plugins.querydsl" version "1.0.10"
}

compileJava {
    options.compilerArgs << '-Amapstruct.defaultComponentModel=spring'
}

sourceSets {
	main {
		java {
			srcDir "$buildDir/generated-source"
		}
	}
}

group = 'com.savbill.salescrmsbss'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '1.8'

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	maven {
		url "https://artifactorypg.paytm.in/artifactory/libs-release"
		allowInsecureProtocol = true
	}
	maven {
		url "https://iwf1.jfrog.io/artifactory/iwf-libs-release-local"
	}
}

configurations.all {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
}

ext {
	set('springCloudVersion', "Hoxton.SR11")
	set('log4j2.version',"2.17.1")
	queryDslVersion = "5.0.0"
}

dependencies {
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-zuul'
	implementation 'org.springframework.boot:spring-boot-starter-activemq'
	//implementation 'org.springframework.boot:spring-boot-starter-amqp'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-quartz'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	implementation 'net.sf.ehcache:ehcache'

	implementation group: 'org.apache.commons', name: 'commons-dbcp2', version: '2.7.0'
	implementation group: 'javax.json', name: 'javax.json-api', version: '1.0-b01'
	implementation group: 'org.apache.poi', name: 'poi-ooxml', version: '4.1.2'
	implementation group: 'org.liquibase', name: 'liquibase-core', version: '4.5.0'

	compile group: 'io.springfox', name: 'springfox-swagger2', version: '3.0.0'
	compile group: 'io.springfox', name: 'springfox-swagger-ui', version: '3.0.0'
	implementation group: 'io.springfox', name: 'springfox-swagger2', version: '3.0.0'
	implementation group: 'io.springfox', name: 'springfox-swagger-ui', version: '3.0.0'

    implementation group: 'com.itextpdf', name: 'itextpdf', version: '5.5.13.2'
	implementation 'com.google.code.gson:gson:2.9.0'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.11.2'
	implementation 'io.jsonwebtoken:jjwt-impl:0.11.2'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.11.2'
	implementation 'org.apache.httpcomponents:httpclient:4.5.13'
	implementation 'org.springframework.cloud:spring-cloud-starter-sleuth'

	implementation 'log4j:log4j:1.2.17'

	annotationProcessor 'org.projectlombok:lombok'
	compileOnly 'org.projectlombok:lombok'
	compile group: 'org.apache.poi', name: 'poi-ooxml', version: '4.1.0'
	compile group: 'org.springframework.boot', name: 'spring-boot-starter-data-jpa'
	compile group: 'org.springframework.boot', name: 'spring-boot-starter-web'
	compile group: 'org.springframework.boot', name:'spring-boot-devtools'
	compile group: 'org.springframework.boot', name: 'spring-boot-starter-validation'
	//compile group: 'org.springframework.boot', name: 'spring-boot-starter-amqp'
	compile group: 'org.mapstruct', name: 'mapstruct-jdk8', version: '1.2.0.Final'
	compile group: 'net.sf.ehcache', name: 'ehcache'
	compile group: 'org.projectlombok',name:'lombok'
	compile group: 'org.snmp4j', name: 'snmp4j', version: '2.6.2'
	compile group: 'com.itextpdf', name: 'itextpdf', version: '5.5.13.2'
	compile 'org.javers:javers-spring-boot-starter-sql:6.14.0'
	implementation 'org.javers:javers-spring-boot-starter-sql:6.14.0'
	compile "org.springframework.plugin:spring-plugin-core:1.2.0.RELEASE"
   	compile 'com.querydsl:querydsl-jpa'
	testImplementation 'org.assertj:assertj-core: 3.20.0'
	implementation 'org.assertj:assertj-core:3.20.0'
	compile 'org.assertj:assertj-core:3.20.0'
   	compile 'org.json:json:20210307'
   	implementation 'com.squareup.okhttp3:okhttp:3.12.0'
	compile 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    compile 'org.springframework.cloud:spring-cloud-starter-netflix-zuul'
	compile group: 'com.squareup.okhttp3', name: 'okhttp', version: '3.12.0'
	compile group: 'org.springframework.boot', name: 'spring-boot-starter-security'
	compile 'io.jsonwebtoken:jjwt-api:0.11.2'
	compile 'io.jsonwebtoken:jjwt-impl:0.11.2'
	compile 'io.jsonwebtoken:jjwt-jackson:0.11.2'


	implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    compile group: 'org.springframework.boot', name: 'spring-boot-starter-actuator' , version: '2.3.11.RELEASE'
   
   	//annotationProcessor 'com.querydsl:querydsl-apt'
   
	runtimeOnly 'mysql:mysql-connector-java'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	//testImplementation 'org.springframework.amqp:spring-rabbit-test'
	testImplementation 'org.springframework.security:spring-security-test'

	implementation group: 'ch.qos.logback',name:'logback-classic',version:'1.2.3'
    implementation 'ch.qos.logback:logback-classic:1.2.3'
    implementation group: 'ch.qos.logback.contrib', name: 'logback-json-classic', version: '0.1.2'
    implementation 'org.slf4j:slf4j-api:1.7.30'
    implementation 'com.querydsl:querydsl-jpa:5.0.0'
    implementation "com.querydsl:querydsl-core:${queryDslVersion}"
	implementation 'io.micrometer:micrometer-core'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation group: 'org.json', name: 'json', version: '20220924'

	compile 'io.zipkin.brave:brave:5.12.2'
	implementation 'io.zipkin.brave:brave:5.12.2'

	// Kafka Library
	implementation group: 'org.apache.kafka', name: 'kafka-clients', version: '2.8.0'
	compile group: 'org.apache.kafka', name: 'kafka-clients', version: '2.8.0'
	implementation 'org.springframework.retry:spring-retry:1.3.1'
	implementation group: 'org.springframework.kafka', name: 'spring-kafka', version: '2.8.6'
	compile group: 'org.springframework.kafka', name: 'spring-kafka', version: '2.8.6'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	implementation 'org.springframework.kafka:spring-kafka'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

sonarqube {
    properties {
        property "sonar.sourceEncoding", "UTF-8"
    }
}

task fatJar(type: Jar) {
	manifest {
        attributes 'SalesCrmsBss': 'Gradle Jar SalesCrmsBss',  
        	'Implementation-Version': version,
        	'Main-Class': 'com.savbill.salescrmsbss.SalesCrmsBssApplication'
    }
    baseName = project.name + '-all'
    from { configurations.compile.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}
querydsl {
	jpa = true
	querydslSourcesDir = "$buildDir/generated-source"
}

compileQuerydsl {
	options.annotationProcessorPath = configurations.querydsl
}
test {
	systemProperty "spring.profiles.active", "test"
}

test {
	useJUnitPlatform()
}
