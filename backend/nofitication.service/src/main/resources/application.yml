server:
  port: ${PORT:9092}

spring:  
  application:
    name: SavbillNotification-Service
  rabbitmq:
    listener:
      simple:
        retry:
          enabled: false
          initial-interval: 3s
          max-attempts: 1
          max-interval: 10s
          multiplier: 2

eureka:
  instance:
    instance-id: ${spring.application.name}-${server.port}
    prefer-ip-address: true
  client:
    fetchRegistry: true
    register-with-eureka: true
    serviceUrl:
      defaultZone: http://127.0.0.1:8761/eureka/
