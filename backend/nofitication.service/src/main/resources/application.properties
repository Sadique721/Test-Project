server.port=9092
spring.datasource.url=jdbc:mysql://localhost:3306/savbillnotification?createDatabaseIfNotExist=true
#spring.datasource.url=jdbc:mysql://localhost:3306/savbillnotification?autoreconnect = true&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
logging.level.com.savbill==DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
logging.level.org.springframework.jdbc.core.JdbcTemplate=INFO
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=INFO
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-main.xml
spring.jpa.properties.org.hibernate.envers.default_schema=audit
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL5InnoDBDialect
#scheduling.job.cron=0 1 */3 * * *
management.endpoints.web.exposure.include=prometheus,metrics
#10 hours token
jwt.token.validity=36000000
#5 minute token time - 3,00,000   #1 minute time- 60,000..currently it works for captiveportal only
jwt.captive.portal.token.validity=10800000
jwt.secret=savbillsecret
request.logging.shouldLog=true
# Kafka Config
#kafka-url=192.168.24.30:9093
kafka-url=localhost:9092
max.poll.records=15000
fetch.max.bytes=524288000
fetch.min.bytes=1

spring.kafka.topic.registeredTopic=NOTIFICATIONCOMMON
#Destination Emails - mails sent to:
email.dest.email=testsavbillyd@outlook.com
email.dest.altEmail=savbilltest3email@gmail.com
email.preconfigure.eventName=Dynamic HTML Mail Sending
email.subject=Test Mail Process Success
email.template.dirPath=/temp
#email.template.dirPath=/root/iwf/email-templates
cronjobtimeforsmsnotification=0 1 */3 * * *
spring.enable.scheduling=true
SMSHASUPPORT=true
javers.mappingStyle=FIELD
javers.algorithm=SIMPLE
javers.commitIdGenerator=synchronized_sequence
javers.prettyPrint=true
javers.typeSafeValues=false
javers.initialChanges=true
javers.terminalChanges=true
javers.packagesToScan=*
javers.auditableAspectEnabled=true
javers.springDataAuditableRepositoryAspectEnabled=true
#javers.objectAccessHook=""
javers.usePrimitiveDefaults=true
#javers.prettyPrintDateFormats=""
javers.localDateTime='dd MMM yyyy, HH:mm:ss'
javers.zonedDateTime='dd MMM yyyy, HH:mm:ss'
javers.localDate='dd MMM yyyy'
javers.localTime='HH:mm:ss'
javers.sqlSchema=savbillnotification
javers.sqlSchemaManagementEnabled=true
javers.sqlGlobalIdCacheDisabled=false
javers.objectAccessHook=org.javers.hibernate.integration.HibernateUnproxyObjectAccessHook
javers.sqlGlobalIdTableName=jv_global_id
javers.sqlCommitTableName=jv_commit
javers.sqlSnapshotTableName=jv_snapshot
javers.sqlCommitPropertyTableName=jv_commit_property
# Specify the directory where you want to save the uploaded files
spring.http.multipart.max-file-size=10MB
spring.http.multipart.max-request-size=10MB
# The thread pool size for the notification queue at the Kafka receiver
thread.pool.size=5
#base configuration for SLF4J logging
logging.base.path=/root/logs/slf4j/notification/
logging.base.max-history-in-hours=720
logging.base.console-log-level=info
logging.base.file-log-level=info
logging.base.file.enabled=true

spring.profiles.active=rabbitmq,kafka

#kafka.bootstrapAddress=192.168.24.30
#kafka.port=9092

instanceId=NOTIFICATION-1