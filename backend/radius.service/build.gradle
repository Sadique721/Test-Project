	compile group: 'org.springframework.kafka', name: 'spring-kafka', version: '2.8.6'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	implementation 'org.springframework.kafka:spring-kafka'
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	compile 'org.springframework.cloud:spring-cloud-starter-openfeign'

	// Optional: Commons Pool2 for Redis connection pooling
	implementation 'org.apache.commons:commons-pool2:2.11.1'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis:2.7.10'
	implementation group: 'org.springframework.boot', name: 'spring-boot-starter-data-redis', version: '2.7.10'
	compile group: 'org.springframework.boot', name: 'spring-boot-starter-data-redis', version: '2.7.10'


}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}



sonarqube {
    properties {
        property "sonar.sourceEncoding", "UTF-8"
    }
}

task fatJar(type: Jar) {
	manifest {
        attributes 'SavbillRadiusServer': 'Gradle Jar SavbillRadiusServer',  
        	'Implementation-Version': version,
        	'Main-Class': 'com.savbill.radius.radiusservice.SavbillRadiusApplication'
    }
    baseName = project.name + '-all'
    from { configurations.compile.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}

querydsl {
	jpa = true
	querydslSourcesDir = "$buildDir/generated-source"
}

compileQuerydsl {
	options.annotationProcessorPath = configurations.querydsl
}

test {
	systemProperty "spring.profiles.active", "test"
}


