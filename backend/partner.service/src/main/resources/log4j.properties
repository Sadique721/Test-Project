log4j.rootLogger=DEBUG, file, console

log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=log/savbill-partner.log
log4j.appender.file.MaxFileSize=100MB
log4j.appender.file.MaxBackupIndex=10
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern={"level":"%p", "user":"%X{userName}", "trace-id":"%X{traceId}", "span-id":"%X{spanId}", "type":"%X{type}","timestamp":"%d{ISO8601}", "module":"Savbill-Partner-Management","thread":"%t","sub-module":"%F", "line":"%L","message":"%m"}%n

log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern={"level":"%p", "user":"%X{userName}", "trace-id":"%X{traceId}", "span-id":"%X{spanId}", "type":"%X{type}","timestamp":"%d{ISO8601}", "module":"Savbill-Partner-Management","thread":"%t","sub-module":"%F", "line":"%L","message":"%m"}%n

log4j.logger.commonlog=DEBUG, commonlog
log4j.additivity.commonlog=false
log4j.appender.commonlog=org.apache.log4j.RollingFileAppender
log4j.appender.commonlog.File=SavbillWifiServer.log
log4j.appender.commonlog.MaxFileSize=100MB
log4j.appender.commonlog.MaxBackupIndex=10
log4j.appender.commonlog.layout=org.apache.log4j.PatternLayout
log4j.appender.commonlog.layout.ConversionPattern={"level":"%p", "user":"%X{userName}", "trace-id":"%X{traceId}", "span-id":"%X{spanId}", "type":"%X{type}","timestamp":"%d{ISO8601}", "module":"Savbill-Partner-Management","thread":"%t","sub-module":"%F", "line":"%L","message":"%m"}%n

log4j.logger.io.swagger.models.parameters.AbstractSerializableParameter=error
# Set the logging level for Hibernate to INFO
log4j.logger.org.hibernate=INFO
