//	exclude group: 'ch.qos.logback', module: 'logback-classic'
}

task fatJar(type: Jar) {
    manifest {
        attributes 'SavbillIntegrationSystem': 'Gradle Jar SavbillIntegrationSystem',
                'Implementation-Version': version,
                'Main-Class': 'com.savbill.integrationsystem.IntegrationSystemApplication'
    }
    baseName = project.name + '-all'
    from { configurations.compile.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}

test {
    systemProperty "spring.profiles.active", "test"
}

tasks.named('test') {
    useJUnitPlatform()
}


// Task for generating JAXB classes from XSD
task genJaxb {
    ext.sourcesDir = file("${buildDir}/generated-sources/jaxb")
    ext.classesDir = file("${buildDir}/classes/jaxb")
    outputs.dir sourcesDir

    doLast {
        // Find all XSD files in the specified directory
        def schemaFiles = fileTree(dir: 'src/main/resources/xsd', include: '**/*.xsd')

        project.ant {
            taskdef(name: 'xjc', classname: 'com.sun.tools.xjc.XJCTask', classpath: configurations.compileClasspath.asPath)
            mkdir(dir: sourcesDir)
            mkdir(dir: classesDir)

            // JAXB XJC task to generate Java files from XSDs
            schemaFiles.each { xsdFile ->

                def fileNameWithoutExtension = xsdFile.name.replaceAll(/\.[^.]+$/, "") // Remove the file extension
                def targetPackage = "com.savbill.integrationsystem.generated.${fileNameWithoutExtension.toLowerCase()}"


                // Directly call xjc without a nested fileset
                xjc(destdir: sourcesDir) {
                    arg(value: xsdFile.absolutePath) // Pass the XSD file directly
                    arg(value: "-p")
                    arg(value: targetPackage)// specify your package name
                }
            }

            // Compile the generated Java sources
            javac(destdir: classesDir, source: '1.8', target: '1.8', debug: true, classpath: configurations.compileClasspath.asPath) {
                src(path: sourcesDir)
                include(name: "**/*.java")
            }

            // Copy non-Java files if necessary
            copy(todir: classesDir) {
                fileset(dir: sourcesDir, erroronmissingdir: false) {
                    exclude(name: "**/*.java")
                }
            }
        }
    }
}


task afterEclipseImport {
    dependsOn "genJaxb"
}
// Set the generated sources as part of the source set
sourceSets {
    main {
        java {
            srcDir "$buildDir/generated-sources/jaxb"
        }
    }
}

compileJava {
    dependsOn afterEclipseImport
}

// Task to include generated classes in the jar
jar {
    baseName = 'gs-producing-web-service'
    version = '0.1.0'
    from genJaxb.classesDir
}

tasks.named('test') {
    useJUnitPlatform()
}