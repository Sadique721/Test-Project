server.port=40080
app.name=/SavbillRevenueManagement
spring.datasource.url=jdbc:mysql://localhost:3306/savbillrevenuemanagement?allowPublicKeyRetrieval=true&useSSL=false&autoreconnect=true&createDatabaseIfNotExist=true

spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL5InnoDBDialect
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.datasource.hikari.maximum-pool-size=350
spring.datasource.hikari.connection-timeout = 300000
spring.datasource.hikari.minimum-idle= 50
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime= 600000
spring.liquibase.change-log=classpath:db/changelog/db.changelog.main.xml
spring.mvc.view.suffix=.html
spring.http.multipart.max-file-size=10MB
spring.http.multipart.max-request-size=10MB
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.com.savbill=INFO
logging.level.org.springframework=INFO
logging.level.root=INFO
#logging.level.org.hibernate.type=TRACE
logging.level.org.hibernate.SQL=ERROR
logging.level.org.springframework.jdbc.core=INFO
server.error.whitelabel.enabled=false
#spring.jpa.properties.org.hibernate.envers.default_schema=audit
spring.jpa.properties.hibernate.integration.envers.enabled=false
#javers.sqlSchemaManagementEnabled=false
#javers.auditableAspectEnabled=false
#javers.springDataAuditableRepositoryAspectEnabled=false
logging.level.org.springframework.transaction=Info
project.currency=Rs
project.currency.cent=Paisa
spring.rabbitmq.listener.simple.concurrency=10
#CronJob Time For Postpaid Invoice Creation (Every Midnight 23:58PM)
cronjobtimeforrevenueeverydaymidnight=0 58 23 * * ?
#CronJob Time For Revenue Report for Month (Every first Day of  Month  05:00AM)
cronjobtimeforeverymonthfirstday=0 5 0 1 * ?
#CronJob Time For Postpaid Invoice Creation (Every Midnight 00:05AM)
cronjobforpostpaidinvoicedaymidnight=0 5 * * * ?
#cronjobforgenerateinvoicepdf=0 0/5 * * * ?
#cronjobforsendinvoicepdf=0 0/5 * * * ?
cronjobforgenerateinvoicenumber=0 1 */3 * * *
cronJobTimeForAutomatePayment=0 58 23 * * ?
cronJobTimeForPartnerCommissionInvoice=0 1 0 1 * ?
#0 */2 * * * *
management.endpoints.web.exposure.include=prometheus,metrics

javers.mappingStyle=FIELD
javers.algorithm=SIMPLE
javers.commitIdGenerator=synchronized_sequence
javers.prettyPrint=true
javers.typeSafeValues=false
javers.initialChanges=true
javers.terminalChanges=true
javers.packagesToScan=*
javers.auditableAspectEnabled=true
javers.springDataAuditableRepositoryAspectEnabled=true
#javers.objectAccessHook=""
javers.usePrimitiveDefaults=true
#javers.prettyPrintDateFormats=""
javers.localDateTime='dd MMM yyyy, HH:mm:ss'
javers.zonedDateTime='dd MMM yyyy, HH:mm:ssZ'
javers.localDate='dd MMM yyyy'
javers.localTime='HH:mm:ss'
javers.async.enabled=true


javers.sqlSchema=savbillrevenuemanagement
javers.sqlSchemaManagementEnabled=true
javers.sqlGlobalIdCacheDisabled=false
javers.objectAccessHook=org.javers.hibernate.integration.HibernateUnproxyObjectAccessHook
javers.sqlGlobalIdTableName=jv_global_id
javers.sqlCommitTableName=jv_commit
javers.sqlSnapshotTableName=jv_snapshot
javers.sqlCommitPropertyTableName=jv_commit_property
thread.min=40
thread.max=40


#kafka.bootstrapAddress=127.0.0.1
kafka-url=127.0.0.1:9092
max.poll.records=15000
fetch.max.bytes=524288000
fetch.min.bytes=1
kafka.max.request.size=2000000000

feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000

# for retry mechanism

max.retries=3
max.retryDelay=1000
spring.enable.auto.assign.renewal.scheduling = false
max.wallet.difference.allowed=1

instanceId=revenue-1
postpaid.invoice.day.midnight.isNextBilldate=false

spring.kafka.consumer.properties.session.timeout.ms=30000
spring.kafka.consumer.properties.heartbeat.interval.ms=10000

cronJobTimeForKraInvoice=0 0 0 31 12 *
cronJobTimeForKraCreditNote=0 0 0 31 12 *
