<!DOCTYPE html>
<html lang="en" class="fullscreen-bg">
  <head>
    <title>Login | savbill Dashboard</title>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />

    <link
      rel="apple-touch-icon"
      sizes="76x76"
      href="assets/img/apple-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="assets/img/favicon.png"
    />
  </head>

  <body class="loginbg">
    <p-toast
      [style]="{ height: 'auto', width: '20vw', fontSize: '16px' }"
    ></p-toast>
    <ngx-spinner type="ball-clip-rotate-multiple" size="medium">
      <p class="loading">Loading...</p>
    </ngx-spinner>
    <div id="wrapper" pFocusTrap>
      <div class="vertical-align-wrap">
        <div class="vertical-align-middle">
          <div class="row-horizontal">
            <div class="col-lg-6 col-md-6 col-sm-9 col-xs-12 mb-15">
              <div class="auth-box">
                <div class="left">
                  <div class="content">
                    <div class="header">
                      <div class="logo text-center">
                        <img
                          src="../../assets/img/loginlogo.jpg"
                          alt="savbill Logo"
                          class="savbilllogo"
                        />
                      </div>
                      <h2>
                        <strong><span>Logged in as user: </span></strong>
                        <strong
                          ><span style="color: #f7b206">{{
                            userData.username
                          }}</span></strong
                        >
                      </h2>
                    </div>
                  </div>
                </div>
                <div class="right">
                  <div class="overlay"></div>
                  <div class="content text">
                    <h1 class="heading">Lorem ipsum dolor sit consectetur.</h1>
                    <p>Adipiscing elit</p>
                  </div>
                </div>
                <div class="clearfix"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
<div class="displayView">
  <p-dialog
    header="Rating"
    [(visible)]="displayRating"
    [modal]="true"
    [style]="{ width: '50%' }"
    [draggable]="false"
    [resizable]="false"
  >
    <div>
      <div class="modal-body-junk">
        <form [formGroup]="ratingForm">
          <div class="form-group" style="padding-top: 10px">
            <label class="datalbl">Rating </label>
            <div style="display: flex">
              <div style="width: 100%; padding-top: 10px">
                <p-rating [cancel]="false" formControlName="rating"></p-rating>
              </div>
              <div
                class="errorWrap text-danger"
                *ngIf="isRatingError && ratingForm.controls.rating.errors"
              >
                <div
                  class="error text-danger"
                  *ngIf="
                    isRatingError && ratingForm.controls.rating.errors.required
                  "
                >
                  Rating is required.
                </div>
              </div>
            </div>
          </div>
          <div class="form-group">
            <div class="row">
              <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <label style="padding-top: 10px">Feedback</label>
                <div style="padding-top: 10px; display: flex">
                  <textarea
                    class="form-control"
                    rows="3"
                    formControlName="feedback"
                  ></textarea>
                  <div
                    class="errorWrap text-danger"
                    *ngIf="isRatingError && ratingForm.controls.feedback.errors"
                  >
                    <div
                      class="error text-danger"
                      *ngIf="
                        isRatingError &&
                        ratingForm.controls.feedback.errors.required
                      "
                    >
                      Feedback is required.
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </form>
        <div class="row">
          <div class="bottom" style="padding-top: 10px">
            <button
              pButton
              pRipple
              style="margin: 3px"
              label="Submit"
              icon="pi pi-check"
              (click)="getFeedbackBuCustomer()"
            ></button>
          </div>
        </div>
      </div>
    </div>
  </p-dialog>
</div>
