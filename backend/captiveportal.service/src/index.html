    <script>
      fetch("./assets/env.js", {
        method: "GET",
        headers: {
          "X-Script-Tag-Request": "true", // Set custom header
        },
      })
        .then((response) => {
          if (response.ok) {
            return response.text();
          } else {
            console.error(
              "Failed to load env.js:",
              response.status,
              response.statusText
            );
          }
        })
        .then((text) => {
          console.log("response body:::", text); // Log the response body
          eval(text); // Evaluate the retrieved script content
        })
        .catch((error) => {
          console.error("Error fetching env.js:", error);
        });
    </script>
