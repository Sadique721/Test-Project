server.port=30080
app.name=/SavbillCommonGateway
spring.datasource.url=jdbc:mysql://localhost:3308/commongateway?allowPublicKeyRetrieval=true&useSSL=false&autoreconnect=true&createDatabaseIfNotExist=true&rewriteBatchedStatements=true&cachePrepStmts=true&useServerPrepStmts=false
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL5InnoDBDialect
spring.datasource.username=root
spring.datasource.password=diameterserver@2024@db
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog.main.xml
spring.mvc.view.suffix=.html
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.com.savbill=WARN
logging.level.org.springframework=WARN
logging.level.root=WARN
#logging.level.org.hibernate.type=TRACE
logging.level.org.hibernate.SQL=ERROR
logging.level.org.springframework.jdbc.core=INFO
server.error.whitelabel.enabled=false
#spring.jpa.properties.org.hibernate.envers.default_schema=audit
spring.jpa.properties.hibernate.integration.envers.enabled=false
#javers.sqlSchemaManagementEnabled=false
##javers.auditableAspectEnabled=false
##javers.springDataAuditableRepositoryAspectEnabled=false
javers.mappingStyle=FIELD
javers.algorithm=SIMPLE
javers.commitIdGenerator=synchronized_sequence
javers.prettyPrint=true
javers.typeSafeValues=false
javers.initialChanges=true
javers.terminalChanges=true
javers.packagesToScan=*
javers.auditableAspectEnabled=true
javers.springDataAuditableRepositoryAspectEnabled=true
#javers.objectAccessHook=""
javers.usePrimitiveDefaults=true
#javers.prettyPrintDateFormats=""
javers.localDateTime='dd MMM yyyy, HH:mm:ss'
javers.zonedDateTime='dd MMM yyyy, HH:mm:ssZ'
javers.localDate='dd MMM yyyy'
javers.localTime='HH:mm:ss'
javers.sqlSchema=savbillcommonapigateway
javers.sqlSchemaManagementEnabled=true
javers.sqlGlobalIdCacheDisabled=false
javers.objectAccessHook=org.javers.hibernate.integration.HibernateUnproxyObjectAccessHook
javers.sqlGlobalIdTableName=jv_global_id
javers.sqlCommitTableName=jv_commit
javers.sqlSnapshotTableName=jv_snapshot
javers.sqlCommitPropertyTableName=jv_commit_property
logging.level.org.springframework.transaction=Info
logging.level.org.springframework.transaction.interceptor=TRACE
management.endpoints.web.exposure.include=prometheus,metrics
#10 hours token
#jwt.token.validity=36000000
#jwt.secret=asdfSFS34wfsdfsdfSDSD32dfsddDDerQSNCK34SOWEK5354fdgdf4
jwt.refreshExpirationDateInMs=9000000
## Enable Sleuth to send traces to Zipkin
#spring.zipkin.sender.type=web
# for socket endpoint enable for gui
websocket.gui.endpoint=http://localhost:4200,https://localhost:4200
spring.profiles.active=rabbitmq ,kafka
#spring.kafka.producer.bootstrap-servers= localhost:9092
#spring.kafka.topic.registeredTopic =SavbillCommonGateway
#spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
#spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Configure the maximum number of attempts for retrying message processing
spring.kafka.consumer.max-attempts=3
savbill.defaultprovision.scheme=http
savbill.defaultprovision.host=localhost
#kafka.bootstrapAddress=127.0.0.1
#kafka.port=9092
kafka-url=127.0.0.1:9092
topicPartition=1
replicationFactor=1
max.poll.records=15000
fetch.max.bytes=524288000
kafka.max.request.size=2000000000
fetch.min.bytes=1
# Configure the backoff period between retry attempts (in milliseconds)
spring.kafka.consumer.properties.spring.retry.backoff.ms=1000
# Configure the maximum backoff period (optional, if you want to set a maximum backoff)
spring.kafka.consumer.properties.spring.retry.backoff.max.ms=5000
# Kafka consumer key deserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Kafka consumer value deserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
#Schedular of Password expiration for staffUser
scheduler.cron.password-expiration=0 50 18 * * ?
zuul.host.connect-timeout-millis=10000
zuul.host.socket-timeout-millis=3000
server.max-http-header-size=64KB
jwt.expiration.seconds=86400

