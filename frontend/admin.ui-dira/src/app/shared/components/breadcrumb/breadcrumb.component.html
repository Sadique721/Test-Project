@if (pageInfo?.["title"] != "Analytical" && pageInfo?.["title"] != "eCommerce") {
  <div
    class="rounded p-y-30 p-x-24 m-b-30 overflow-hidden"
    [style.background-image]="savanaStusbar"
    [style.background-repeat]="'no-repeat'"
    [style.background-size]="'cover'"
    [style.background-position]="'center center'"
  >
    <div class="row">
      <div class="col-sm-8">
        <p class="page-title m-0 f-s-20 f-w-600 m-b-16">
          {{ navService.menuSelection()?.main ? navService.menuSelection().main : "Dashboard" }}
        </p>
        <div class="d-flex align-items-center overflow-hidden">
          <ul class="breadcrumb">
            <!-- <li class="breadcrumb-item active f-s-14">{{navService.menuSelection()?.main ? navService.menuSelection().main : "Dashboard"}}</li> -->

            @if (navService.menuSelection().sub) {
              <!-- <li class="breadcrumb-item">
                <i class="pi pi-circle-fill"></i>
            </li> -->
              <li class="breadcrumb-item active f-s-14">{{ navService.menuSelection().sub }}</li>
            }
          </ul>
        </div>
      </div>
      <div class="col-sm-4 text-right position-relative">
        <!-- <div class="breadcrumb-icon">
          <img src="/assets/images/breadcrumb/ChatBc.png" alt="breadcrumb" width="165" />
        </div> -->
      </div>
    </div>
  </div>
}
