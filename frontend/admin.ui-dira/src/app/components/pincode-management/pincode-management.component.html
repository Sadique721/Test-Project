<!-- pincode card header search part start -->
<div class="row header-row">
    <mat-card class="cardWithShadow w-100">
        <mat-card-content class="mat-card-content-border">
            <div class="row">
                <div class="col-sm-9 d-flex">
                    <mat-form-field appearance="outline" style="margin-left: 16px" class="w-100 hide-hint mr-10">
                        <input class="input-p-5" [(ngModel)]="searchPincodeName" matInput
                            placeholder="Search {{ pincodeTitle }}" (keydown.enter)="searchPincode()" />
                        <mat-icon matSuffix class="search-header-search-icon">
                            <i class="pi pi-search icon-size"></i>
                        </mat-icon>
                    </mat-form-field>
                    <button mat-button mat-flat-button color="primary" class="button-normal m-r-10"
                        (click)="searchPincode()">
                        Search
                    </button>
                    <button mat-stroked-button matButton="outlined" class="button-normal"
                        (click)="clearSearchPincode()">
                        Clear
                    </button>
                </div>
                <div class="col-sm-3 search-div">
                    <button mat-button mat-flat-button color="primary" (click)="addEditPincodeDialog()"
                        class="button-normal m-r-10">
                        Add {{ pincodeTitle }}
                    </button>
                </div>
            </div>
        </mat-card-content>
    </mat-card>
</div>
<!-- pincode card header search part end -->

<!-- body part start -->
<div class="container-fluid contain-flud">
    <div class="row">
        <!-- pincode list table start -->
        <div class="col-md-12">
            <mat-card class="cardWithShadow">
                <mat-card-content class="mat-card-content-border">
                    <div class="country-table-list">
                        <div class="table-container">
                            <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8 w-100">
                                <!-- Id Column -->
                                <ng-container matColumnDef="id">
                                    <th mat-header-cell *matHeaderCellDef class="table-header-title">ID</th>

                                    <td mat-cell *matCellDef="let ele" class="f-s-14">
                                        {{ ele.pincodeid }}
                                    </td>
                                </ng-container>

                                <!-- Road -->
                                <ng-container matColumnDef="Road">
                                    <th mat-header-cell *matHeaderCellDef mat-sort-header class="table-header-title"
                                        sticky>
                                        Road
                                    </th>
                                    <td mat-cell *matCellDef="let element" class="f-s-14">{{ element.pincode }}</td>
                                </ng-container>

                                <!-- OLT -->
                                <ng-container matColumnDef="OLT">
                                    <th mat-header-cell *matHeaderCellDef mat-sort-header class="table-header-title"
                                        sticky>
                                        OLT
                                    </th>
                                    <td mat-cell *matCellDef="let element" class="f-s-14">{{ element.cityName }}</td>
                                </ng-container>

                                <!-- Sub-County -->
                                <ng-container matColumnDef="sub-County">
                                    <th mat-header-cell *matHeaderCellDef mat-sort-header class="table-header-title"
                                        sticky>
                                        Division
                                    </th>
                                    <td mat-cell *matCellDef="let element" class="f-s-14">{{ element.stateName }}</td>
                                </ng-container>

                                <!-- County -->
                                <ng-container matColumnDef="County">
                                    <th mat-header-cell *matHeaderCellDef mat-sort-header class="table-header-title"
                                        sticky>
                                        District
                                    </th>
                                    <td mat-cell *matCellDef="let element" class="f-s-14">
                                        {{ element.countryName }}
                                    </td>
                                </ng-container>

                                <!-- Status -->
                                <ng-container matColumnDef="Status">
                                    <th mat-header-cell *matHeaderCellDef mat-sort-header class="table-header-title"
                                        sticky>
                                        Status
                                    </th>
                                    <td mat-cell *matCellDef="let city" class="f-s-14">
                                        <span class="status-badge" [ngClass]="{
                        'status-success': city.status === 'Active',
                        'status-danger': city.status === 'Inactive'
                      }">
                                            {{ city.status }}
                                        </span>
                                    </td>
                                </ng-container>

                                <!-- Action -->
                                <ng-container matColumnDef="Action">
                                    @if (editAccess || deleteAccess) {
                                    <th mat-header-cell *matHeaderCellDef mat-sort-header class="table-header-title">
                                        Action
                                    </th>
                                    }
                                    <td mat-cell *matCellDef="let pincode">
                                        @if (editAccess) {
                                        <a mat-icon-button matTooltip="edit" href="javascript:void(0)"
                                            (click)="editPincode(pincode.pincodeid)">
                                            <img src="assets/img/DashboardIcons/Edit.svg">
                                        </a>
                                        }

                                        @if (deleteAccess) {
                                        <a mat-icon-button matTooltip="delete" href="javascript:void(0)"
                                            (click)="deleteConfirmonPincodeDialog(pincode)">
                                            <img src="assets/img/DashboardIcons/trash-bin-trash-svgrepo-com 1.svg">
                                        </a>
                                        }
                                    </td>
                                </ng-container>

                                <!-- Header & Rows -->
                                <tr mat-header-row class="table-header-bg"
                                    *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                                <tr mat-row class="table-content-row" *matRowDef="let row; columns: displayedColumns">
                                </tr>
                            </table>

                            <!-- Sticky Paginator -->
                            <mat-paginator class="custome-paginator" stickyEnd [length]="pincodetotalRecords"
                                [pageSize]="pincodeitemPerpage" [pageSizeOptions]="[5,10,20,50,100]" showFirstLastButtons
                                (page)="pageChangePincodeList($event)">
                            </mat-paginator>
                        </div>
                    </div>
                </mat-card-content>
            </mat-card>
        </div>
        <!-- pincode list table end -->
    </div>
</div>
<!-- body part end -->
