<div class="row header-row">
  <mat-card class="cardWithShadow w-100">
    <mat-card-content class="mat-card-content-border">
      <div class="row">
        <div class="col-sm-9 d-flex">
          <mat-form-field appearance="outline" class="w-100 hide-hint mr-10 m-l-16">
            <input class="input-p-5" matInput placeholder="Enter Rejected Reason Master Name"
              [(ngModel)]="searchRejectedReasonName" (keydown.enter)="searchRejectedReason()" />
            <mat-icon matSuffix class="search-header-search-icon">
              <i class="pi pi-search icon-size"></i>
            </mat-icon>
          </mat-form-field>
          <button mat-button mat-flat-button color="primary" class="button-normal m-r-10" type="submit"
            (click)="searchRejectedReason()">
            Search
          </button>
          <button mat-stroked-button matButton="outlined" class="button-normal" type="button"
            (click)="clearSearchRejectedReason()">
            Clear
          </button>
        </div>
        <div class="col-sm-3 search-div">
          <button mat-button mat-flat-button color="primary" (click)="addEditRejectedReasonDialog()"
            class="button-normal mr-10" style="width: auto">
            Add Rejected Reason
          </button>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
<div class="container-fluid contain-flud">
  <div class="row">
    <div class="col-md-12">
      <mat-card class="cardWithShadow">
        <mat-card-content class="mat-card-content-border">
          <div class="country-table-list">
            <div class="table-container">
              <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8 w-100">
                <ng-container matColumnDef="id">
                  <th mat-header-cell *matHeaderCellDef class="table-header-title">ID</th>
                  <td mat-cell *matCellDef="let source">{{ source.id }}</td>
                </ng-container>
                <ng-container matColumnDef="name">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header class="table-header-title" sticky>
                    Rejected Reason
                  </th>
                  <td mat-cell *matCellDef="let source" class="f-s-14">
                    <span class="ellipsis-text">
                      {{ source.name }}
                    </span>
                  </td>
                </ng-container>
                <ng-container matColumnDef="status">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header class="table-header-title" sticky>
                    Status
                  </th>
                  <td mat-cell *matCellDef="let source" class="f-s-14">
                    <span class="status-badge" [ngClass]="{
                        'status-success': source.status === 'Active',
                        'status-danger': source.status === 'Inactive'
                      }">
                      {{ source.status }}
                    </span>
                  </td>
                </ng-container>
                <ng-container matColumnDef="action" *ngIf="editAccess || deleteAccess || viewAccess">
                  <th mat-header-cell *matHeaderCellDef stickyEnd class="table-header-title">
                    Action
                  </th>
                  <td mat-cell *matCellDef="let source" class="btnAction">
                    <a *ngIf="viewAccess" mat-icon-button matTooltip="view" href="javascript:void(0)"
                      (click)="openRejectedReasonDetailsDialog(source)">
                     <img src="assets/img/DashboardIcons/eye-svgrepo-com (1) 1.svg" >
                    </a>
                    <a *ngIf="editAccess" mat-icon-button matTooltip="edit" href="javascript:void(0)"
                      (click)="editRejectedReasonMasterDataFunction(source.id)">
                      <img src="assets/img/DashboardIcons/Edit.svg" >
                    </a>
                    <a *ngIf="deleteAccess" mat-icon-button matTooltip="delete" href="javascript:void(0)"
                      (click)="deleteConfirmonSubReasonDialog(source)">
                      <img src="assets/img/DashboardIcons/trash-bin-trash-svgrepo-com 1.svg" >
                    </a>
                  </td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" class="table-header-bg"></tr>
               <tr mat-row *matRowDef="let row; columns: displayedColumns; trackBy: trackByRejectedReasonId" class="table-content-row"></tr>

              </table>
            </div>

            <mat-paginator [length]="rejectedReasonDataListTotalRecords" [pageSize]="rejectedReasonItemsPerPage"
              [pageSizeOptions]="[5,10,20,50,100]" (page)="pageChangedTrscList($event)" showFirstLastButtons>
            </mat-paginator>
          </div>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
<ng-template #rejectedReasonDetailsDialog let-dialogRef="dialogRef">
  <div class="dialog-container">
    <div class="dialog-header dialog-header-titleFont">
      View Rejected Reason Master
      <span>
        <a mat-icon-button href="javascript:void(0)" (click)="dialogRef.close()">
           <img src="assets/img/DashboardIcons/Reject.svg">
        </a>
      </span>
    </div>

    <div mat-dialog-content>
      <div class="col-md-12">
        <mat-card class="cardWithShadow">
          <mat-card-header>
            <mat-card-title class="f-w-600 f-s-15">Basic Details</mat-card-title>
          </mat-card-header>
          <mat-card-content class="matcard-content">
            <div class="row">
              <div class="col-lg-6 col-md-6 d-flex align-items-center">
                <label class="inputLabel mb-0">Rejected Reason <span class="m-20">:</span></label>
                <div class="f-s-14">{{ viewTrscData.name }}</div>
              </div>
              <div class="col-lg-6 col-md-6 d-flex align-items-center">
                <label class="inputLabel mb-0">Status <span class="m-20">:</span></label>
                <div class="status-badge" [ngClass]="{
                    'status-success': viewTrscData.status === 'Active',
                    'status-danger': viewTrscData.status === 'Inactive'
                  }">
                  {{ viewTrscData.status }}
                </div>
              </div>
            </div>
          </mat-card-content>
        </mat-card>
        <mat-card *ngIf="viewTrscData.rejectSubReasonDtoList?.length > 0" class="cardWithShadow">
          <mat-card-header>
            <mat-card-title class="f-w-600 f-s-15">Rejected Sub Reason Detail</mat-card-title>
          </mat-card-header>
          <mat-card-content>
            <div class="table-responsive table-container">
              <table mat-table [dataSource]="paginatedSubReasons" class="w-100">
                <ng-container matColumnDef="subSource">
                  <th mat-header-cell *matHeaderCellDef class="inputLabel">Sub Source</th>
                  <td mat-cell *matCellDef="let element" class="f-s-14">{{ element.name }}</td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="subReasonDisplayedColumns; sticky: true" class="table-header-bg">
                </tr>
                <tr mat-row *matRowDef="
                    let row;
                    columns: subReasonDisplayedColumns;
                    trackBy: trackBySubReasonId
                    " class="table-content-row"></tr>
              </table>

              <mat-paginator [length]="viewTrscData?.rejectSubReasonDtoList?.length || 0"
                [pageSize]="rejectedSubReasonItemsPerPage" [pageSizeOptions]="[5,10,20,50,100]"
                (page)="pageChangedleadSubSourceOnView($event)" showFirstLastButtons>
              </mat-paginator>
            </div>
          </mat-card-content>
        </mat-card>
      </div>
    </div>
    <div mat-dialog-actions class="p-0 m-t-10 dialog-action-adjust">
      <button mat-stroked-button mat-dialog-close class="button-normal">Close</button>
    </div>
  </div>
</ng-template>
