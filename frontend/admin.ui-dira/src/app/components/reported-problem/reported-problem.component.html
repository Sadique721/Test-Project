<div class="row header-row">
  <mat-card class="cardWithShadow w-100">
    <mat-card-content class="mat-card-content-border">
      <div class="row">
        <div class="col-sm-9 d-flex">
          <mat-form-field appearance="outline" class="w-100 hide-hint mr-10 m-l-16">
            <input class="input-p-5" [(ngModel)]="searchPhoneNo" matInput placeholder="Enter Mobile No."
              (keydown.enter)="searchReportedData()"/>
            <mat-icon matSuffix class="search-header-search-icon">
             <i class="pi pi-search icon-size"></i>
            </mat-icon>
          </mat-form-field>
          <button mat-button mat-flat-button color="primary" class="button-normal m-r-10"
            (click)="searchReportedData()">
            Search
          </button>
          <button mat-stroked-button matButton="outlined" class="button-normal" (click)="clearReportedData()">
            Clear
          </button>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
<div class="container-fluid contain-flud">
  <div class="row">
    <div class="col-md-12">
      <mat-card class="cardWithShadow">
        <mat-card-content class="mat-card-content-border">
        
          <div class="country-table-list">
            <div class="table-container">
              <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8 w-100 equal-width-table">
                <!-- Issue Column -->
                <ng-container matColumnDef="issue">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header sticky class="table-header-title">Issue</th>
                  <td mat-cell *matCellDef="let data" class="f-s-14">{{ data.issue }}</td>
                </ng-container>

                <!-- Phone Column -->
                <ng-container matColumnDef="phno">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header sticky class="table-header-title">Phone</th>
                  <td mat-cell *matCellDef="let data" class="f-s-14">{{ data.phno }}</td>
                </ng-container>

                <!-- Description Column -->
                <ng-container matColumnDef="desc">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header sticky class="table-header-title">Description
                  </th>
                  <td mat-cell *matCellDef="let data" class="f-s-14">{{ data.desc }}</td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"
                  class="table-header-bg"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns" class="table-content-row">
                </tr>
              </table>

              <mat-paginator [length]="reportedProblemtotalRecords" [pageSize]="reportedProblemitemsPerPage"
                [pageSizeOptions]="[5,10,20,50,100]" showFirstLastButtons (page)="pageChangedReportedProblemList($event)">
              </mat-paginator>
            </div>
          </div>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
