<div class="row header-row">
    <mat-card class="cardWithShadow w-100">
        <mat-card-content class="mat-card-content-border">
            <div class="row">
                <div class="col-sm-9 d-flex"></div>
                <div class="col-sm-3 search-div">
                    <button mat-button mat-flat-button color="primary" (click)="addEditIntegrationConfigDialog()"
                        class="button-normal mr-10" style="width: auto">
                        Add Integration Config
                    </button>
                </div>
            </div>
        </mat-card-content>
    </mat-card>
</div>

<div class="container-fluid contain-flud">
    <div class="row">
        <div class="col-md-12">
            <mat-card class="cardWithShadow">
                <mat-card-content class="mat-card-content-border">
                    <div class="country-table-list">
                        <div class="table-container">
                            <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8 w-100">
                                <ng-container matColumnDef="id">
                                    <th mat-header-cell *matHeaderCellDef class="table-header-title" sticky>ID</th>
                                    <td mat-cell *matCellDef="let config" class="f-s-14">{{ config.id }}</td>
                                </ng-container>
                                <ng-container matColumnDef="name">
                                    <th mat-header-cell *matHeaderCellDef mat-sort-header class="table-header-title"
                                        sticky>
                                        Name
                                    </th>
                                    <td mat-cell *matCellDef="let config" class="f-s-14">{{ config.name }}</td>
                                </ng-container>
                                <ng-container matColumnDef="baseurl">
                                    <th mat-header-cell *matHeaderCellDef mat-sort-header class="table-header-title"
                                        sticky>
                                        Base URL
                                    </th>
                                    <td mat-cell *matCellDef="let config" class="f-s-14">{{ config.baseurl }}</td>
                                </ng-container>
                                <ng-container matColumnDef="action">
                                    <th mat-header-cell *matHeaderCellDef stickyEnd class="table-header-title">
                                        Action
                                    </th>
                                    <td mat-cell *matCellDef="let config">
                                        <a mat-icon-button matTooltip="edit" href="javascript:void(0)"
                                            *ngIf="editAccess" (click)="editConfigById(config.id)" title="Edit">
                                            <img src="assets/img/DashboardIcons/Edit.svg">
                                        </a>
                                        <a mat-icon-button matTooltip="delete" href="javascript:void(0)"
                                            *ngIf="deleteAccess" (click)="deleteIntegrationConfirmation(config.id)"
                                            title="Delete">
                                            <img src="assets/img/DashboardIcons/trash-bin-trash-svgrepo-com 1.svg">
                                        </a>
                                    </td>
                                </ng-container>
                                <tr mat-header-row *matHeaderRowDef="getDisplayedPlanDetailsColumns(); sticky: true"
                                    class="table-header-bg"></tr>
                                <tr mat-row class="table-content-row"
                                    *matRowDef="let row; columns: getDisplayedPlanDetailsColumns()"></tr>
                            </table>
                            <mat-paginator [length]="integrationConfigTotalRecords"
                                [pageSize]="integrationConfigItemsPerPage" [pageSizeOptions]="[5,10,20,50,100]"
                                (page)="pageChanged($event)" showFirstLastButtons>
                            </mat-paginator>
                        </div>
                    </div>
                </mat-card-content>
            </mat-card>
        </div>
    </div>
</div>
