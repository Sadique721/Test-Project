<div class="row">
  <div class="col-md-12">
    <mat-card class="cardWithShadow">
      <mat-card-header>
        <img src="assets/img/DashboardIcons/Back Arrow.svg" alt="arrow back" class="m-r-10" (click)="customerDetailOpen()">
        <div style="font-size:x-large; align-items: center; font-weight: 500; align-content: center;">
          {{ custData.title }} {{ custData.firstname }} {{ custData.lastname }} Dunning Details
        </div>
      </mat-card-header>
      <mat-card-content class="mat-card-content-border">
        <div style="margin-top: 20px; font-size: large;">
          Dunning Status :
          <mat-slide-toggle [disabled]="!dunningStatusAccess" [checked]="custData.isDunningEnable"
            (change)="getDunningDisableEnable(custData.id, $event.checked)">
          </mat-slide-toggle>
        </div>
        <div class="country-table-list">
          <div class="table-container">
            <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8 w-100">

              <ng-container matColumnDef="dunningMessageDate">
                <th mat-header-cell *matHeaderCellDef mat-sort-header class="table-header-title" sticky> Dunning Date
                </th>
                <td mat-cell *matCellDef="let dunning"> {{ dunning.dunningMessageDate | date: 'dd/MM/yyyy' }} </td>
              </ng-container>

              <ng-container matColumnDef="eventName">
                <th mat-header-cell *matHeaderCellDef mat-sort-header class="table-header-title" sticky> Event </th>
                <td mat-cell *matCellDef="let dunning"> {{ dunning.eventName }} </td>
              </ng-container>

              <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef mat-sort-header class="table-header-title" sticky> Operation
                </th>
                <td mat-cell *matCellDef="let dunning"> {{ dunning.action }} </td>
              </ng-container>

              <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
            </table>

            <mat-paginator [length]="DunningtotalRecords1" [pageSize]="DunningitemsPerPage1"
              [pageSizeOptions]="[5,10,20,50,100]" showFirstLastButtons (page)="pageChangedMasterDunnningList($event)">
            </mat-paginator>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
