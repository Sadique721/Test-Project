<ng-template #changePasswordModal>
    <div class="dialog-container">
        <div class="dialog-header">
            CHANGE PASSWORD
            <span>
                <a mat-icon-button (click)="closeDialog()">
                    <img src="assets/img/DashboardIcons/Reject.svg" />
                </a>
            </span>
        </div>

        <div mat-dialog-content>
            <form [formGroup]="changePasswordForm" name="changePasswordForm">
                <mat-label class="f-s-14 f-w-600 m-b-8 d-block">New Password</mat-label>
                <mat-form-field appearance="outline" class="w-100" color="primary">
                    <input matInput [type]="_passwordNewType" id="newpassword" placeholder="Enter New Password"
                        name="newpassword" formControlName="newpassword" />
                    <mat-icon matSuffix (click)="
              showNewPassword = !showNewPassword;
              _passwordNewType = showNewPassword ? 'text' : 'password'
            " style="cursor:pointer">
                        {{ showNewPassword ? 'visibility_off' : 'visibility' }}
                    </mat-icon>
                </mat-form-field>

                <mat-label class="f-s-14 f-w-600 m-b-8 d-block">Confirm New Password</mat-label>
                <mat-form-field appearance="outline" class="w-100" color="primary">
                    <input matInput [type]="_passwordConfirmType" id="confirmNewPassword"
                        placeholder="Enter Confirm Password" name="confirmNewPassword"
                        formControlName="confirmNewPassword" />
                    <mat-icon matSuffix (click)="
      showConfirmPassword = !showConfirmPassword;
      _passwordConfirmType = showConfirmPassword ? 'text' : 'password'
    " style="cursor:pointer">
                        {{ showConfirmPassword ? 'visibility_off' : 'visibility' }}
                    </mat-icon>
                    <mat-error *ngIf="changePasswordForm.get('confirmNewPassword').hasError('mustMatch')">
                        Passwords do not match.
                    </mat-error>
                </mat-form-field>

            </form>
        </div>

        <div mat-dialog-actions>
            <button mat-flat-button color="primary" type="submit" [disabled]="!changePasswordForm.valid"
                (click)="changePassword()" mat-dialog-close>
                SAVE
            </button>
            <button mat-stroked-button (click)="clearChangePasswordForm()">CLEAR</button>
            <button mat-stroked-button mat-dialog-close (click)="closeDialog()" color="warn">CLOSE</button>
        </div>
    </div>
</ng-template>
