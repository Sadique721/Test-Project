<div class="dialog-container">
    <!-- Header -->
    <div class="dialog-header">
        Change Status
        <span>
            <a mat-icon-button href="javascript:void(0)" (click)="closeChangeStatus(false)">
                <img src="assets/img/DashboardIcons/Reject.svg">

            </a>
        </span>
    </div>

    <!-- Content -->
    <div mat-dialog-content class="space-y-4">
        <div>
            <label class="inputLabel">Current Status: {{ custStatus }}</label>
        </div>

        <!-- <label class="inputLabel">Select New Status</label> -->
        <mat-form-field appearance="outline" class="w-100">
            <mat-select [(ngModel)]="updatedStatus" placeholder="Select a New Status">
                @for (status of commondropdownService.customerChangeStatusValue; track status) {
                <mat-option [value]="status.value">{{ status.value }}</mat-option>
                }
            </mat-select>
        </mat-form-field>

        <div>
            <label class="inputLabel">
                Remark
                @if (updatedStatus === 'Terminate' && !remark) {
                <span class="text-warn">*</span>
                }
            </label>

            <!-- <label class="inputLabel">Enter Remark</label> -->
            <mat-form-field appearance="outline" class="w-100">
                <input matInput [(ngModel)]="remark" placeholder="Enter Remark" />
            </mat-form-field>
        </div>
    </div>

    <!-- Footer -->
    <mat-dialog-actions align="end">
        <button mat-flat-button color="primary" class="button-normal" (click)="changeStatus(updatedStatus, remark)"
            [disabled]="!updatedStatus || (updatedStatus === 'Terminate' && !remark)">

            Save
        </button>

        <button mat-stroked-button color="warn" class="button-normal" (click)="closeChangeStatus(false)">
            Close
        </button>
    </mat-dialog-actions>
</div>
