<p-dialog
  header="Covered Area"
  [(visible)]="isAllPolygoneModelShow"
  [style]="{ height: '90%', width: '80%' }"
  [modal]="true"
  [responsive]="true"
  [draggable]="false"
  [closable]="true"
  (onHide)="hidePolygonModel()"
  >
  <div class="modal-body" style="height: 85% !important; overflow: auto !important">
    <div class="row">
      <div class="col-lg-7 col-md-6">
        <input
          type="searchLocationname"
          class="form-control"
          id="searchLocationname"
          placeholder="Enter Location Name"
          [(ngModel)]="location"
          ngx-google-places-autocomplete
          (onAddressChange)="handleAddressChange($event)"
          />
          <br />
        </div>
        <br />
      </div>
      <div class="row">
        <div class="col-lg-12 col-md-12">
          <google-map
            height="400px"
            width="100%"
            [center]="{ lat: lat, lng: lng }"
            [zoom]="zoom"
            [mapTypeId]="'hybrid'"
            (mapReady)="onAllPolygonMapReady($event)"
            >
            @for (m of markers; track m) {
              <map-marker
                [position]="{ lat: m.lat, lng: m.lng }"
                [label]="m.label"
                [options]="{ draggable: m.draggable }"
                >
              </map-marker>
            }
          </google-map>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <div class="addUpdateBtn">
        <button type="button" class="btn btn-default" (click)="hidePolygonModel()">Close</button>
      </div>
    </div>
  </p-dialog>
