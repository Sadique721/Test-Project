<div class="row header-row p-0 m-0">
  <mat-card class="cardWithShadow w-100">
    <mat-card-content class="mat-card-content-border">
      <div class="row">
        <!-- Search Type Dropdown -->
        <div class="col-lg-3 col-md-3 p-0 m-0">
          <mat-form-field
            appearance="outline"
            class="w-100 hide-hint mr-10 header-input"
            style="padding-left: 16px"
          >
            <mat-select
              class="input-p-5"
              [(ngModel)]="searchType"
              (selectionChange)="getSearchType($event)"
              placeholder="Select Search Type"
            >
              <mat-option *ngFor="let item of searchTypeList" [value]="item.value">
                {{ item.label }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <!-- From Date -->
        <div class="col-lg-3 col-md-3 p-0 m-0" *ngIf="isDateRangeShow">
          <mat-form-field
            appearance="outline"
            class="w-100 hide-hint mr-10 header-input"
            style="padding-left: 8px"
          >
            <input
              matInput
              class="input-p-5"
              [matDatepicker]="fromDatePicker"
              placeholder="From Date"
              [(ngModel)]="searchFormDate"
              (keydown.enter)="searchDBR()"
            />
            <mat-datepicker-toggle matSuffix [for]="fromDatePicker"></mat-datepicker-toggle>
            <mat-datepicker #fromDatePicker></mat-datepicker>
          </mat-form-field>
        </div>

        <!-- To Date -->
        <div class="col-lg-3 col-md-3 p-0 m-0" *ngIf="isDateRangeShow">
          <mat-form-field
            appearance="outline"
            class="w-100 hide-hint mr-10 header-input"
            style="padding-left: 8px"
          >
            <input
              matInput
              class="input-p-5"
              [matDatepicker]="toDatePicker"
              [(ngModel)]="searchEndDate"
              [min]="searchFormDate"
              (keydown.enter)="searchDBR()"
              placeholder="To Date"
            />
            <mat-datepicker-toggle matSuffix [for]="toDatePicker"></mat-datepicker-toggle>
            <mat-datepicker #toDatePicker></mat-datepicker>
          </mat-form-field>
        </div>

        <!-- Start Month -->
        <div class="col-lg-3 col-md-3 p-0 m-0" *ngIf="isMonthShow">
          <mat-form-field
            appearance="outline"
            class="w-100 hide-hint mr-10 header-input"
            style="padding-left: 8px"
          >
            <input
              matInput
              class="input-p-5"
              placeholder="Select Start Month"
              [matDatepicker]="startMonthPicker"
              [(ngModel)]="searchStartMonth"
              (keydown.enter)="searchDBR()"
            />
            <mat-datepicker-toggle matSuffix [for]="startMonthPicker"></mat-datepicker-toggle>
            <mat-datepicker
              #startMonthPicker
              startView="multi-year"
              (monthSelected)="searchStartMonth = $event; startMonthPicker.close()"
              panelClass="month-picker"
            >
            </mat-datepicker>
          </mat-form-field>
        </div>

        <!-- End Month -->
        <div class="col-lg-3 col-md-3 p-0 m-0" *ngIf="isMonthShow">
          <mat-form-field
            appearance="outline"
            class="w-100 hide-hint mr-10 header-input"
            style="padding-left: 8px"
          >
            <input
              matInput
              class="input-p-5"
              [matDatepicker]="endMonthPicker"
              [(ngModel)]="searchEndMonth"
              [min]="searchStartMonth"
              (keydown.enter)="searchDBR()"
              placeholder="Select End Month"
            />
            <mat-datepicker-toggle matSuffix [for]="endMonthPicker"></mat-datepicker-toggle>
            <mat-datepicker
              #endMonthPicker
              startView="multi-year"
              (monthSelected)="searchEndMonth = $event; endMonthPicker.close()"
              panelClass="month-picker"
            >
            </mat-datepicker>
          </mat-form-field>
        </div>
        <div class="col-lg-3 col-md-3 p-0 m-0 d-flex">
          <button
            mat-button
            mat-flat-button
            color="primary"
           class="button-normal m-r-10"
            (click)="searchDBR()"
            style="margin-left: 8px"
          >
            Search
          </button>
          <button
            
            mat-stroked-button
            matButton="outlined"
           class="button-normal "
            (click)="searchClearDBR()"
          >
            Clear
          </button>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>

<div class="container-fluid contain-flud">
  <div class="row">
    <div class="col-md-12">
      <mat-card class="cardWithShadow">
        <mat-card-content class="mat-card-content-border">
          <div class="country-table-list">
            <div *ngIf="dbrListData.length > 0; else noData">
              <div class="example-container mat-elevation-z8" tabindex="0">
                <table
                  mat-table
                  [dataSource]="
                    dbrListData.slice(pageIndex * pageSize, pageIndex * pageSize + pageSize)
                  "
                >
                  <!-- Date Column -->
                  <ng-container matColumnDef="startdate" *ngIf="gridDateDisplay">
                    <th mat-header-cell *matHeaderCellDef class="table-header-title">Date</th>
                    <td mat-cell *matCellDef="let dbr">{{ dbr.startdate | date:'dd-MM-yyyy' }}</td>
                  </ng-container>

                  <!-- Month Column -->
                  <ng-container matColumnDef="month" *ngIf="gridMonthDisplay">
                    <th mat-header-cell *matHeaderCellDef class="table-header-title">Month</th>
                    <td mat-cell *matCellDef="let dbr">{{ dbr.month }}</td>
                  </ng-container>

                  <!-- Prepaid Revenue -->
                  <ng-container matColumnDef="pendingamt">
                    <th mat-header-cell *matHeaderCellDef class="table-header-title">
                      Prepaid Revenue
                    </th>
                    <td mat-cell *matCellDef="let dbr">{{ dbr.pendingamt | number: "1.2-2" }}</td>
                  </ng-container>

                  <!-- Revenue -->
                  <ng-container matColumnDef="dbr">
                    <th mat-header-cell *matHeaderCellDef class="table-header-title">Revenue</th>
                    <td mat-cell *matCellDef="let dbr">{{ dbr.dbr | number: "1.2-2" }}</td>
                  </ng-container>

                  <!-- Header & Row -->
                  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                </table>
              </div>
              <!-- Paginator -->

              <mat-paginator
                [length]="dbrListData.length"
                [pageSize]="pageSize"
                [pageIndex]="pageIndex"
                [pageSizeOptions]="[5,10,20,50,100]"
                showFirstLastButtons
                (page)="pageIndex = $event.pageIndex; pageSize = $event.pageSize"
              >
              </mat-paginator>
            </div>

            <!-- No Data Case -->
            <ng-template #noData>
              <div class="p-3">Revenue data not found</div>
            </ng-template>
          </div></mat-card-content
        >
      </mat-card>
    </div>
  </div>
</div>
