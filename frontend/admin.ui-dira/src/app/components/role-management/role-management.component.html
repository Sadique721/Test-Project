<div class="row">
  @if (isRoleList) {
  <div class="col-md-12">
    <div class="panel">
      <div class="panel-heading">
        <h3 class="panel-title">Role</h3>
        <div class="right">
          <button type="button" class="btn-toggle-collapse" data-toggle="collapse" data-target="#listrole"
            aria-expanded="false" aria-controls="listrole">
            <i class="fa fa-minus-circle"></i>
          </button>
        </div>
      </div>
      <div id="listrole" class="panel-collapse collapse in">
        <div class="panel-body table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Status</th>
                @if (editAccess || deleteAccess) {
                <th>Action</th>
                }
              </tr>
            </thead>
            <tbody>
              @for (
              role of roleList
              | paginate
              : {
              id: 'listing_roledata',
              itemsPerPage: itemsPerPage,
              currentPage: currentPage,
              totalItems: totalRecords
              }; track
              role; let i = $index) {
              <tr>
                <td>{{ role.rolename }}</td>
                <td>
                  @if (role.status == 'Active') {
                  <span class="badge badge-success"> Active </span>
                  }
                  @if (role.status == 'Inactive') {
                  <span class="badge badge-danger">
                    Inactive
                  </span>
                  }
                </td>
                @if (editAccess || deleteAccess) {
                <td class="btnAction">
                  @if (editAccess) {
                  <a id="edit" type="button" (click)="editRoleById(role.id, i)" class="curson_pointer">
                  <img src="assets/img/DashboardIcons/Edit.svg" >
                  </a>
                  }
                  @if (deleteAccess) {
                  <a id="delete" (click)="deleteConfirm(role)" class="curson_pointer">
                     <img src="assets/img/DashboardIcons/trash-bin-trash-svgrepo-com 1.svg" >
                  </a>
                  }
                </td>
                }
              </tr>
              }
            </tbody>
          </table>
          <br />
          <div class="pagination_Dropdown">
            <pagination-controls id="listing_roledata" maxSize="10" directionLinks="true" previousLabel="" nextLabel=""
              (pageChange)="pageChanged($event)"></pagination-controls>
            <div id="itemPerPageDropdown">
              <p-dropdown [options]="pageLimitOptions" [(ngModel)]="currentPageSize" optionLabel="value"
                optionValue="value" (onChange)="TotalItemPerPage($event)"></p-dropdown>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  }
</div>

<div class="row header-row">
    <mat-card class="cardWithShadow w-100">
        <mat-card-content class="mat-card-content-border">
            <div class="row">
                <div class="col-sm-9 d-flex">
                    <!-- <form class="form-auth-small" [formGroup]="searchRoleForm"> -->
                    <mat-form-field appearance="outline" style="margin-left: 16px" class="w-100 hide-hint mr-10">
                        <input class="input-p-5" [(ngModel)]="searchKey" matInput placeholder="Enter Role"
                            (keydown.enter)="searchRoleByName()" />
                        <mat-icon matSuffix class="search-header-search-icon">
                            <i class="pi pi-search icon-size"></i>
                        </mat-icon>
                    </mat-form-field>
                    <!-- </form> -->
                    <button mat-button mat-flat-button color="primary" class="button-normal m-r-10"
                        (click)="searchRoleByName()">
                        Search
                    </button>
                    <button mat-stroked-button matButton="outlined" class="button-normal" (click)="clearSearchForm()">
                        Clear
                    </button>
                </div>

                <div class="col-sm-3 search-div">
                    <button mat-button mat-flat-button color="primary" (click)="openRoleCreateMenu()"
                        class="button-normal mr-10" *ngIf="createAccess">
                        Add Role
                    </button>
                </div>
            </div>
        </mat-card-content>
    </mat-card>
</div>
<div class="container-fluid contain-flud">
    <div class="row">
        <!-- role list table start -->
        <div class="col-md-12" *ngIf="isRoleList">
            <mat-card class="cardWithShadow">
                <mat-card-content class="mat-card-content-border">
                    <div class="country-table-list">
                        <div class="table-container">
                            <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8 w-100">
                                <ng-container matColumnDef="id">
                                    <th mat-header-cell *matHeaderCellDef mat-sort-header class="table-header-title"
                                        sticky>
                                        ID
                                    </th>
                                    <td mat-cell *matCellDef="let role" class="f-s-14">
                                        {{ role.id }}
                                    </td>
                                </ng-container>
                                <!-- Name Column -->
                                <ng-container matColumnDef="Name">
                                    <th mat-header-cell *matHeaderCellDef mat-sort-header class="table-header-title"
                                        sticky>
                                        Name
                                    </th>
                                    <td mat-cell *matCellDef="let role" class="f-s-14">
                                        {{ role.rolename }}
                                    </td>
                                </ng-container>

                                <!-- Status Column -->
                                <ng-container matColumnDef="Status">
                                    <th mat-header-cell *matHeaderCellDef mat-sort-header class="table-header-title"
                                        sticky>
                                        Status
                                    </th>
                                    <td mat-cell *matCellDef="let role" class="f-s-14">
                                        <span class="status-badge" [ngClass]="{
                        'status-success': role.status === 'Active',
                        'status-danger': role.status === 'Inactive'
                      }">
                                            {{ role.status }}
                                        </span>
                                    </td>
                                </ng-container>

                                <!-- Action Column -->
                                <ng-container matColumnDef="Action" *ngIf="editAccess || deleteAccess">
                                    <th mat-header-cell *matHeaderCellDef stickyEnd class="table-header-title">
                                        Action
                                    </th>
                                    <td mat-cell *matCellDef="let role; let i = index">
                                        <a mat-icon-button matTooltip="edit" href="javascript:void(0)"
                                            *ngIf="editAccess" (click)="editRoleById(role.id, i)"
                                            aria-label="Edit role">
                                            <img src="assets/img/DashboardIcons/Edit.svg">
                                        </a>
                                        <a mat-icon-button matTooltip="delete" href="javascript:void(0)"
                                            *ngIf="deleteAccess" (click)="deleteConfirm(role)" aria-label="Delete role">
                                            <img src="assets/img/DashboardIcons/trash-bin-trash-svgrepo-com 1.svg">
                                        </a>
                                    </td>
                                </ng-container>

                                <tr mat-header-row class="table-header-bg"
                                    *matHeaderRowDef="getDisplayedPlanDetailsColumns(); sticky: true"></tr>
                                <tr mat-row class="table-content-row"
                                    *matRowDef="let row; columns: getDisplayedPlanDetailsColumns()">
                                </tr>
                            </table>

                            <mat-paginator [length]="totalRecords" [pageSize]="itemsPerPage"
                                [pageSizeOptions]="[5, 10, 20, 50, 100]" showFirstLastButtons (page)="pageChanged($event)">
                            </mat-paginator>
                        </div>
                    </div>
                </mat-card-content>
            </mat-card>
        </div>
        <!-- role list table end -->

        <!-- role create/edit component -->
        <div *ngIf="isRoleCreateOrEdit">
            <app-create-role [roleData]="roleData" (roleSaveorUpdated)="roleSaveorUpdated()">
            </app-create-role>
        </div>
    </div>
</div>
