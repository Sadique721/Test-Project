<!-- country card header search part start -->
<div class="row header-row">
    <mat-card class="cardWithShadow w-100">
        <mat-card-content class="mat-card-content-border">
            <div class="row">
                <div class="col-sm-9 d-flex">
                    <mat-form-field appearance="outline" style="margin-left: 16px" class="w-100 hide-hint mr-10">
                        <input class="input-p-5" [(ngModel)]="searchCountryName" matInput
                            placeholder="Search {{ title }}" (keydown.enter)="searchCountry()" />
                        <mat-icon matSuffix class="search-header-search-icon">
                            <i class="pi pi-search icon-size"></i>
                        </mat-icon>
                    </mat-form-field>

                    <button mat-button mat-flat-button color="primary" class="button-normal m-r-10"
                        (click)="searchCountry()">
                        Search
                    </button>
                    <button mat-stroked-button matButton="outlined" class="button-normal"
                        (click)="clearSearchCountry()">
                        Clear
                    </button>
                </div>

                <div class="col-sm-3 search-div">
                    <button mat-button mat-flat-button color="primary" (click)="addEditCountryDialog()"
                        class="button-normal mr-10">
                        Add {{ title }}
                    </button>
                </div>
            </div>
        </mat-card-content>
    </mat-card>
</div>
<!-- country card header search part end -->

<!-- body part start -->

<div class="container-fluid contain-flud">
    <div class="row">
        <!-- country list table start -->
        <div class="col-md-12">
            <mat-card class="cardWithShadow">
                <mat-card-content class="mat-card-content-border">
                    <div class="country-table-list">
                        <div class="table-container">
                            <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8 w-100">
                                <!-- Checkbox Column -->
                                <ng-container matColumnDef="id">
                                    <!-- Header cell -->
                                    <th mat-header-cell *matHeaderCellDef class="table-header-title">ID</th>

                                    <!-- Data cell -->
                                    <td mat-cell *matCellDef="let country">
                                        {{ country.id }}
                                    </td>
                                </ng-container>

                                <!-- Name Column -->
                                <ng-container matColumnDef="Name">
                                    <th mat-header-cell *matHeaderCellDef mat-sort-header class="table-header-title"
                                        sticky>
                                        Name
                                    </th>
                                    <td mat-cell *matCellDef="let country" class="f-s-14">{{ country.name }}</td>
                                </ng-container>

                                <!-- Status Column -->
                                <ng-container matColumnDef="Status">
                                    <th mat-header-cell *matHeaderCellDef mat-sort-header class="table-header-title"
                                        sticky>
                                        Status
                                    </th>
                                    <td mat-cell *matCellDef="let country" class="f-s-14">
                                        <span class="status-badge" [ngClass]="{
                        'status-success': country.status === 'Active',
                        'status-danger': country.status === 'Inactive'
                      }">
                                            {{ country.status }}
                                        </span>
                                    </td>
                                </ng-container>

                                <!-- Action Column -->
                                <ng-container matColumnDef="Action">
                                    <th mat-header-cell *matHeaderCellDef stickyEnd class="table-header-title">
                                        Action
                                    </th>
                                    <td mat-cell *matCellDef="let country">
                                        <a mat-icon-button href="javascript:void(0)" matTooltip="edit"
                                            (click)="editCountry(country.id)">
                                            <img src="assets/img/DashboardIcons/Edit.svg">
                                        </a>
                                        <a mat-icon-button matTooltip="delete" href="javascript:void(0)"
                                            (click)="deleteConfirmonCountryDialog(country)">
                                            <img src="assets/img/DashboardIcons/trash-bin-trash-svgrepo-com 1.svg">
                                        </a>
                                    </td>
                                </ng-container>

                                <tr mat-header-row class="table-header-bg"
                                    *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                                <tr mat-row class="table-content-row" *matRowDef="let row; columns: displayedColumns">
                                </tr>
                            </table>

                            <mat-paginator [length]="countrytotalRecords" [pageSize]="countryitemsPerPage"
                                [pageSizeOptions]="[5,10,20,50,100]" showFirstLastButtons
                                (page)="pageChangedCountryList($event)">
                            </mat-paginator>
                        </div>
                    </div>
                </mat-card-content>
            </mat-card>
        </div>
        <!-- country list table end -->
    </div>
</div>

<!-- body part end -->
