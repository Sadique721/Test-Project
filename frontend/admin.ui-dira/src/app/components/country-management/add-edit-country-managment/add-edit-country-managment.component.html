<div class="dialog-container">
    <div class="dialog-header">
        {{ data.title }}
        <span>
            <a mat-icon-button href="javascript:void(0)" (click)="onCancel()">
                <img src="assets/img/DashboardIcons/Reject.svg">
            </a>
        </span>
    </div>
    <div mat-dialog-content>
        <!-- create new country card start -->
        <div class="col-md-12">
            @if (!data.createAcS && !isCountryEdit) {
            <mat-card-content class="matcard-content">
                <div class="panel-body table-responsive">
                    Sorry you have not privilege to create operation!
                </div>
            </mat-card-content>
            }
            @if (data.createAcS || (isCountryEdit && data.editAcs)) {
            <mat-card-content class="matcardContent">
                <form class="card-form mb-3" [formGroup]="countryFormGroup">
                    <div class="row g-3">
                        <!-- Input with label -->
                        <div class="col-md-12 mb-4">
                            <label for="countryname" class="inputLabel">{{ cName }} *</label>
                            <mat-form-field class="mat-form-field" appearance="outline" class="w-100">
                                <input id="countryname" class="input-p-5" matInput [placeholder]="inputName"
                                    formControlName="name"
                                    [ngClass]="{ 'is-invalid': submitted && countryFormGroup.controls.name.errors }"
                                    maxLength="250" />
                                <mat-error *ngIf="
                      countryFormGroup.get('name')?.errors?.['required'] &&
                      (submitted || countryFormGroup.get('name')?.touched)
                    ">
                                    Country Name is required
                                </mat-error>
                                <mat-error *ngIf="
                      submitted && countryFormGroup.get('name')?.hasError('cannotContainSpace')
                    ">
                                    Country Name cannot contain only spaces
                                </mat-error>
                            </mat-form-field>
                        </div>

                        <!-- Select with label -->
                        <div class="col-md-12 mb-4">
                            <label for="statusSelect" class="inputLabel">{{ cStatus }} *</label>
                            <mat-form-field appearance="outline" class="w-100">
                                <mat-select id="statusSelect" class="input-p-5" [placeholder]="inputStatus"
                                    formControlName="status" [ngClass]="{
                      'is-invalid': submitted && countryFormGroup.controls.status.errors
                    }" maxLength="250">
                                    <mat-option *ngFor="let option of statusOptions" [value]="option.label">
                                        {{ option.label }}
                                    </mat-option>
                                </mat-select>
                                <mat-error *ngIf="
                      countryFormGroup.get('status')?.errors?.['required'] &&
                      (submitted || countryFormGroup.get('status')?.touched)
                    ">
                                    Status is required
                                </mat-error>
                            </mat-form-field>
                        </div>
                    </div>
                </form>
            </mat-card-content>
            }
        </div>
        <!-- create new country card end -->
    </div>
    <div mat-dialog-actions class="p-0 m-t-10 dialog-action-adjust">
        <button mat-button mat-flat-button color="primary" class="button-normal" type="submit" (click)="onSubmit()">
            {{ data.title }}
        </button>
        <button mat-stroked-button matButton="outlined" type="button" color="primary" class="button-normal"
            (click)="onCancel()">
            {{ data.noLabel || "Cancel" }}
        </button>
    </div>
</div>
