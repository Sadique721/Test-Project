<!-- sub-country card header search part start -->
<div class="row header-row">
    <mat-card class="cardWithShadow w-100">
        <mat-card-content class="mat-card-content-border">
            <div class="row">
                <div class="col-sm-9 d-flex">
                    <mat-form-field appearance="outline" style="margin-left: 16px" class="w-100 hide-hint mr-10">
                        <input class="input-p-5" [(ngModel)]="searchStateName" matInput
                            placeholder="Search {{ stateTitle }}" (keydown.enter)="searchState()" />
                        <mat-icon matSuffix class="search-header-search-icon">
                            <i class="pi pi-search icon-size"></i>
                        </mat-icon>
                    </mat-form-field>
                    <button mat-button mat-flat-button color="primary" class="button-normal mr-10"
                        (click)="searchState()">
                        Search
                    </button>
                    <button mat-stroked-button matButton="outlined" class="button-normal" (click)="clearSearchState()">
                        Clear
                    </button>
                </div>
                <div class="col-sm-3 search-div">
                    <button mat-button mat-flat-button color="primary" (click)="addEditStateDialog()"
                        class="button-normal m-r-10">
                        Add {{ stateTitle }}
                    </button>
                </div>
            </div>
        </mat-card-content>
    </mat-card>
</div>
<!-- sub-country card header search part end -->

<!-- body part start -->
<div class="container-fluid contain-flud">
    <div class="row">
        <!-- sub-country list table start -->
        <div class="col-md-12">
            <mat-card class="cardWithShadow">
                <mat-card-content class="mat-card-content-border">
                    <div class="country-table-list">
                        <div class="table-container">
                            <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8 w-100">
                                <!-- Id Column -->
                                <ng-container matColumnDef="id">
                                    <th mat-header-cell *matHeaderCellDef class="table-header-title">ID</th>

                                    <td mat-cell *matCellDef="let state">
                                        {{ state.id }}
                                    </td>
                                </ng-container>

                                <ng-container matColumnDef="Name">
                                    <th mat-header-cell *matHeaderCellDef mat-sort-header class="table-header-title"
                                        sticky>
                                        Name
                                    </th>
                                    <td mat-cell *matCellDef="let state" class="f-s-14">
                                        {{ state.name }}
                                    </td>
                                </ng-container>

                                <ng-container matColumnDef="CountryName">
                                    <th mat-header-cell *matHeaderCellDef mat-sort-header class="table-header-title"
                                        sticky>
                                        District Name
                                    </th>
                                    <td mat-cell *matCellDef="let state" class="f-s-14">
                                        {{ state.countryName }}
                                    </td>
                                </ng-container>

                                <ng-container matColumnDef="Status">
                                    <th mat-header-cell *matHeaderCellDef mat-sort-header class="table-header-title"
                                        sticky>
                                        Status
                                    </th>

                                    <td mat-cell *matCellDef="let state" class="f-s-14">
                                        <span class="status-badge" [ngClass]="{
                        'status-success': state.status === 'Active',
                        'status-danger': state.status === 'Inactive'
                      }">
                                            {{ state.status }}
                                        </span>
                                    </td>
                                </ng-container>

                                <ng-container matColumnDef="Action">
                                    @if (editAccess || deleteAccess) {
                                    <th mat-header-cell *matHeaderCellDef class="table-header-title">Action</th>
                                    }

                                    <td mat-cell *matCellDef="let state">
                                        @if (editAccess) {
                                        <a mat-icon-button matTooltip="edit" href="javascript:void(0)"
                                            (click)="editState(state.id)">
                                            <img src="assets/img/DashboardIcons/Edit.svg">
                                        </a>
                                        }

                                        @if (deleteAccess) {
                                        <a mat-icon-button matTooltip="delete" href="javascript:void(0)"
                                            (click)="deleteConfirmonStateDialog(state)">
                                            <img src="assets/img/DashboardIcons/trash-bin-trash-svgrepo-com 1.svg">
                                        </a>
                                        }
                                    </td>
                                </ng-container>

                                <tr mat-header-row class="table-header-bg"
                                    *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                                <tr mat-row class="table-content-row" *matRowDef="let row; columns: displayedColumns">
                                </tr>
                            </table>

                            <mat-paginator class="custome-paginator" stickyEnd [length]="statetotalRecord"
                                [pageSize]="stateitemPerpage" [pageSizeOptions]="[5,10,20,50,100]" showFirstLastButtons
                                (page)="pageChangedStateList($event)">
                            </mat-paginator>
                        </div>
                    </div>
                </mat-card-content>
            </mat-card>
        </div>
        <!-- sub-country list table end -->
    </div>
</div>
<!-- body part end -->
