<!-- ================= BREADCRUMB / BANNER SECTION ================= -->
<div class="breadcrumb-banner p-y-20 p-x-24" [style.background-image]="savanaStusbar" style="
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center;
    margin-left: 25px;
    margin-right: 37px;
    border-bottom-left-radius: 10px;
    border-bottom-right-radius: 10px;
  ">
    <div class="d-flex align-items-center justify-content-between">

        <!-- 🔹 LEFT : MENU TOGGLE -->
        <div class="d-flex align-items-center gap-12" style="margin-left: 18px;">
            <!-- @if (showToggle) {
            <button mat-icon-button (click)="toggleCollapsed.emit()" class="menu-btn">
                <i class="pi pi-bars f-s-18"></i>
            </button>
            } -->

            <!-- 🔹 PAGE TITLE -->
            <div class="page-title-wrapper">
                <span class="page-main">
                    {{ navService.menuSelection()?.main || 'Dashboard' }}
                </span>

                @if (navService.menuSelection().sub) {
                <span class="page-separator">/</span>
                <span class="page-sub">
                    {{ navService.menuSelection().sub }}
                </span>
                }
            </div>
        </div>

        <!-- 🔹 RIGHT : PROFILE -->
        <!-- <button mat-icon-button [matMenuTriggerFor]="profilemenu" aria-label="Notifications" class="m-l-8" style="position: absolute;
    top: 66px;
    left: 96%;">
            <img src="/assets/images/profile/user-1.jpg" class="rounded-circle object-cover icon-35 profile-dd"
                width="35" />
        </button> -->

    </div>

    <!-- ================= PROFILE MENU ================= -->

    <mat-menu #profilemenu="matMenu" class="topbar-dd cardWithShadow">
        <ng-scrollbar class="position-relative" style="height: 647px">
            <div class="p-x-32 p-y-16">
                <h6 class="f-s-16 f-w-600 m-0">User Profile</h6>

                <div class="d-flex align-items-center p-b-24 b-b-1 m-t-16">
                    <img src="/assets/images/profile/user-1.jpg" class="rounded-circle" width="95" />
                    <div class="m-l-16">
                        <h6 class="f-s-14 f-w-600" style="margin-left: 18px;">{{ userName }}</h6>
                        <span class="d-flex align-items-center">
                            <i-tabler name="mail" class="icon-15 m-r-4"></i-tabler>
                            {{ userEmailId }}
                        </span>
                    </div>
                </div>
            </div>
            <div class="p-y-12 p-x-32">
                <a [routerLink]="['mystaff/92']" [queryParams]="{ mystaff: 'StaffDetails' }" mat-stroked-button
                    color="primary" class="w-100">
                    Staff Details
                </a>
            </div>
            <div class="p-y-12 p-x-32">
                <a [routerLink]="['mystaff/92']" [queryParams]="{ mystaff: 'StaffReceipt' }" mat-stroked-button
                    color="primary" class="w-100">
                    Staff Receipt Management
                </a>
            </div>
            <div class="p-y-12 p-x-32">
                <a [routerLink]="['mystaff/92']" [queryParams]="{  mystaff: 'Wallet' }" mat-stroked-button
                    color="primary" class="w-100">
                    Wallet
                </a>
            </div>
            <div class="p-y-12 p-x-32">
                <a [routerLink]="['mystaff/92']" [queryParams]="{ mystaff: 'ChangePassword' }" mat-stroked-button
                    color="primary" class="w-100">
                    Change Password
                </a>
            </div>

            <div class="p-y-12 p-x-32">
                <a [routerLink]="['/login']" mat-stroked-button color="primary" class="w-100">Logout</a>
            </div>
        </ng-scrollbar>
    </mat-menu>
</div>

<!-- change design end here -->
