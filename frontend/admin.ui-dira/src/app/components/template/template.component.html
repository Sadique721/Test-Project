<div class="row header-row">
    <mat-card class="cardWithShadow w-100">
        <mat-card-content class="mat-card-content-border">
            <div class="row">
                <div class="col-sm-9 d-flex">
                    <mat-form-field appearance="outline" class="w-100 hide-hint mr-10 m-l-16">
                        <input class="input-p-5" [(ngModel)]="SearchName" matInput placeholder="Enter Event Name"
                            (keydown.enter)="searchGroupByName()" />
                        <mat-icon matSuffix class="search-header-search-icon">
                            <i class="pi pi-search icon-size"></i>
                        </mat-icon>
                    </mat-form-field>

                    <button mat-button mat-flat-button color="primary" class="button-normal m-r-10"
                        (click)="searchGroupByName()">
                        Search
                    </button>
                    <button mat-stroked-button matButton="outlined" class="button-normal" (click)="clearSearchForm()">
                        Clear
                    </button>
                </div>
            </div>
        </mat-card-content>
    </mat-card>
</div>
<div class="container-fluid contain-flud">
    <div class="row">
        <div class="col-md-12">
            <mat-card class="cardWithShadow">
                <mat-card-content class="mat-card-content-border">
                    <div class="country-table-list">
                        <div class="table-container table-overflow">
                            <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 w-100" matSort>
                                <!-- Event Name Column -->
                                <ng-container matColumnDef="templateName">
                                    <th mat-header-cell *matHeaderCellDef class="table-header-title" mat-sort-header>
                                        Event Name
                                    </th>
                                    <td mat-cell *matCellDef="let group">{{ group.templateName }}</td>
                                </ng-container>

                                <!-- Append URL Column -->
                                <ng-container matColumnDef="appendUrl">
                                    <th mat-header-cell *matHeaderCellDef class="table-header-title">
                                        Append URL
                                    </th>
                                    <td mat-cell *matCellDef="let group">
                                        <div *ngIf="groupAppednURL !== group.templateId"
                                            (click)="appendUrlTemplateDataEdit(group.templateId)">
                                        </div>
                                        <mat-form-field appearance="outline" class="w-100">
                                            <textarea matInput style="height: 120px;" name="appendUrl"
                                                [(ngModel)]="group.appendUrl"
                                                placeholder="Enter SMS Template"></textarea>
                                        </mat-form-field>
                                    </td>
                                </ng-container>

                                <!-- SMS Configured Checkbox Column -->
                                <ng-container matColumnDef="smsEventConfigured">
                                    <th mat-header-cell *matHeaderCellDef class="widthCheckboxColom">
                                        <div class="centerCheckbox">
                                            <mat-checkbox [checked]="issmsChecked" (change)="checkSMSAll($event)"
                                                color="primary"></mat-checkbox>
                                        </div>
                                    </th>
                                    <td mat-cell *matCellDef="let group">
                                        <div class="centerCheckbox">
                                            <mat-checkbox [checked]="group.smsEventConfigured"
                                                (change)="addsmsChecked(group.templateId, $event)"
                                                color="primary"></mat-checkbox>
                                        </div>
                                    </td>
                                </ng-container>

                                <!-- SMS Template Column -->
                                <ng-container matColumnDef="smsTemplateData">
                                    <th mat-header-cell *matHeaderCellDef class="table-header-title">
                                        SMS Template
                                    </th>
                                    <td mat-cell *matCellDef="let group">
                                        <div *ngIf="groupID !== group.templateId"
                                            (click)="smsTemplateDataEdit(group.templateId)">
                                            {{ group.smsTemplateData }}
                                        </div>
                                        <mat-form-field appearance="outline" class="w-100"
                                            *ngIf="groupID === group.templateId">
                                            <textarea matInput style="height: 120px;" name="smsTemplateData"
                                                [(ngModel)]="group.smsTemplateData"
                                                placeholder="Enter SMS Template"></textarea>
                                        </mat-form-field>
                                    </td>
                                </ng-container>

                                <!-- Email Configured Checkbox Column -->
                                <ng-container matColumnDef="emailEventConfigured">
                                    <th mat-header-cell *matHeaderCellDef class="widthCheckboxColom">
                                        <div class="centerCheckbox">
                                            <mat-checkbox [checked]="isEmailChecked" (change)="checkAllEmail($event)"
                                                color="primary"></mat-checkbox>
                                        </div>
                                    </th>
                                    <td mat-cell *matCellDef="let group">
                                        <div class="centerCheckbox">
                                            <mat-checkbox [checked]="group.emailEventConfigured"
                                                (change)="addEmailChecked(group.templateId, $event)"
                                                color="primary"></mat-checkbox>
                                        </div>
                                    </td>
                                </ng-container>

                                <!-- Email Template Column -->
                                <ng-container matColumnDef="emailTemplateData">
                                    <th mat-header-cell *matHeaderCellDef class="table-header-title">
                                        Email Template
                                    </th>
                                    <td mat-cell *matCellDef="let group">
                                        <div *ngIf="groupEmailID !== group.templateId"
                                            (click)="EmailTemplateDataEdit(group.templateId)">
                                            {{ group.emailTemplateData }}
                                        </div>
                                        <mat-form-field appearance="outline" class="w-100"
                                            *ngIf="groupEmailID === group.templateId">
                                            <textarea matInput style="height: 120px;" name="emailTemplateData"
                                                [(ngModel)]="group.emailTemplateData"
                                                placeholder="Enter Email Template"></textarea>
                                        </mat-form-field>
                                    </td>
                                </ng-container>

                                <!-- Action Column -->
                                <ng-container matColumnDef="action">
                                    <th mat-header-cell *matHeaderCellDef stickyEnd class="table-header-title">
                                        Action
                                    </th>
                                    <td mat-cell *matCellDef="let group">
                                        <div *ngIf="saveAccess">
                                            <button mat-flat-button color="primary" class="button-normal"
                                                (click)="editTemplate(group)" data-title="Submit Template Details"
                                                matTooltip="Submit Template Details">
                                                Save
                                            </button>
                                        </div>
                                    </td>
                                </ng-container>

                                <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"
                                    class="table-header-bg"></tr>
                                <tr mat-row *matRowDef="let row; columns: displayedColumns" class="table-content-row">
                                </tr>
                            </table>

                            <mat-paginator [length]="dataSource.length" [pageSize]="5"
                                [pageSizeOptions]="[5,10,20,50,100]" showFirstLastButtons
                                (page)="pageChangedTemplateList($event)">
                            </mat-paginator>
                        </div>
                    </div>
                </mat-card-content>
            </mat-card>
        </div>
    </div>
</div>
