<div class="row">
  <div class="col-md-6 left">
    <div class="panel">
      <div class="panel-heading">
        <h3 class="panel-title">Lead Source Master</h3>
        <div class="right">
          <button type="button" class="btn-toggle-collapse" data-toggle="collapse" data-target="#leadSourceData"
            aria-expanded="false" aria-controls="leadSourceData">
            <i class="fa fa-minus-circle"></i>
          </button>
        </div>
      </div>
      <div id="leadSourceData" class="panel-collapse collapse in">
        <div class="panel-body table-responsive">
          <div class="row">
            @if (leadSourceDataList?.length > 0) {
            <div class="col-lg-12 col-md-12">
              <table class="table">
                <thead>
                  <tr>
                    <th style="width: 30%">Lead Source</th>
                    <th style="width: 20%">Status</th>
                    @if (editAccess || deleteAccess) {
                    <th style="width: 20%">Action</th>
                    }
                  </tr>
                </thead>
                <tbody>
                  @for (
                  source of leadSourceDataList
                  | paginate
                  : {
                  id: 'leadSourceData',
                  itemsPerPage: leadSourceItemsPerPage,
                  currentPage: currentLeadSourceListData,
                  totalItems: leadSourceDataListTotalRecords
                  }; track
                  source; let i = $index) {
                  <tr>
                    <td class="curson_pointer" style="color: #f7941e" data-backdrop="static" data-keyboard="false"
                      data-target="#leadSourceDetails" data-toggle="modal" (click)="trscAllDetails(source)">
                      {{ source.leadSourceName }}
                    </td>
                    @if (source.status == 'Active') {
                    <td>
                      <span class="badge badge-success">Active</span>
                    </td>
                    }
                    @if (source.status == 'Inactive') {
                    <td>
                      <span class="badge badge-danger">Inactive</span>
                    </td>
                    }
                    @if (editAccess || deleteAccess) {
                    <td class="btnAction">
                      @if (editAccess) {
                      <button style="border: none; background: transparent; padding: 0; margin-right: 3px"
                        [disabled]="source.view" id="edit-button" (click)="editLeadSourceMasterDataFunction(source.id)">
                      <img src="assets/img/DashboardIcons/Edit.svg" >
                      </button>
                      }
                      @if (deleteAccess) {
                      <button style="border: none; background: transparent; padding: 0; margin-right: 3px"
                        [disabled]="source.view" id="delete-button" (click)="deleteConfirmonLeadSourceData(source.id)">
                         <img src="assets/img/DashboardIcons/trash-bin-trash-svgrepo-com 1.svg" >
                      </button>
                      }
                    </td>
                    }
                  </tr>
                  }
                </tbody>
              </table>
              <div class="row">
                <div class="col-md-12" style="display: flex">
                  <pagination-controls id="leadSourceData" maxSize="10" directionLinks="true" previousLabel=""
                    nextLabel="" (pageChange)="pageChangedTrscList($event, 'leadSourceData')">
                  </pagination-controls>
                  <div id="itemPerPageDropdown">
                    <p-dropdown [options]="pageLimitOptions" optionLabel="value" optionValue="value"
                      (onChange)="TotalItemPerPage($event)"></p-dropdown>
                  </div>
                </div>
              </div>
            </div>
            }
            @if (leadSourceDataList?.length === 0) {
            <div class="col-lg-12 col-md-12">
              No Records Found
            </div>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="col-md-6 right">

        <div class="panel-body">

            <div class="row">

</div>

<div class="row header-row">
  <mat-card class="cardWithShadow w-100">
    <mat-card-content class="mat-card-content-border">
      <div class="row">
        <div class="col-sm-9 d-flex">
          <mat-form-field appearance="outline" class="w-100 hide-hint mr-10 m-l-16 header-input">
            <input matInput placeholder="Enter Lead Source Master Name" class="input-p-5"
              [(ngModel)]="searchLeadSourceName" (keydown.enter)="searchLeadSource()" />
            <mat-icon matSuffix class="search-header-search-icon">
              <i class="pi pi-search icon-size"></i>
            </mat-icon>
          </mat-form-field>
          <button mat-button mat-flat-button color="primary" class="button-normal m-r-10" type="submit"
            (click)="searchLeadSource()">
            Search
          </button>
          <button mat-stroked-button class="button-normal" type="button" (click)="clearSearchTrsc()">
            Clear
          </button>
        </div>
        <div class="col-sm-3 search-div">
          <button mat-button mat-flat-button color="primary" (click)="addEditLeadSourceDialog()"
            class="button-normal mr-10" style="width: auto;">
            Add Lead Source Master
          </button>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>

<div class="container-fluid contain-flud">
  <div class="row">
    <div class="col-md-12">
      <mat-card class="cardWithShadow">
        <mat-card-content class="mat-card-content-border">
          <div class="country-table-list">
            <div class="table-container">
              <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8 w-100">
                <ng-container matColumnDef="id">
                  <th mat-header-cell *matHeaderCellDef class="table-header-title">ID</th>
                  <td mat-cell *matCellDef="let source">{{ source.id }}</td>
                </ng-container>
                <!-- Lead Source Name Column -->
                <ng-container matColumnDef="leadSourceName">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header class="table-header-title" sticky>
                    Lead Source
                  </th>
                  <td mat-cell *matCellDef="let source" class="f-s-14">
                    <span>
                      {{ source.leadSourceName }}
                    </span>
                  </td>
                </ng-container>

                <!-- Status Column -->
                <ng-container matColumnDef="status">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header class="table-header-title" sticky>
                    Status
                  </th>
                  <td mat-cell *matCellDef="let source" class="f-s-14">
                    <span class="status-badge" [ngClass]="{
                      'status-success': source.status === 'Active',
                      'status-danger': source.status === 'Inactive'
                    }">
                      {{ source.status }}
                    </span>
                  </td>
                </ng-container>

                <!-- Action Column -->
                <ng-container matColumnDef="action" *ngIf="editAccess || deleteAccess || viewAccess">
                  <th mat-header-cell *matHeaderCellDef stickyEnd class="table-header-title">Action</th>
                  <td mat-cell *matCellDef="let source" class="btnAction">
                    <a *ngIf="viewAccess" mat-icon-button matTooltip="view" href="javascript:void(0)"
                      (click)="openLeadSourceDetailsDialog(source)">
                      <!-- <i class="pi pi-eye icon-size"></i> -->
                       <img src="assets/img/DashboardIcons/eye-svgrepo-com (1) 1.svg" >
                    </a>
                    <a *ngIf="editAccess" mat-icon-button matTooltip="edit" href="javascript:void(0)"
                      (click)="editLeadSourceMasterDataFunction(source.id)">
                      <img src="assets/img/DashboardIcons/Edit.svg" >
                        
                    </a>
                    <a *ngIf="deleteAccess" mat-icon-button matTooltip="delete" href="javascript:void(0)"
                      (click)="deleteConfirmonLeadSourceData(source)">
                     
                       <img src="assets/img/DashboardIcons/trash-bin-trash-svgrepo-com 1.svg" >
                    </a>
                  </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="getDisplayedPlanDetailsColumns(); sticky: true" class="table-header-bg"></tr>
                <tr mat-row *matRowDef="let row; columns: getDisplayedPlanDetailsColumns(); trackBy: trackByLeadSourceId"
                  class="table-content-row"></tr>
              </table>
            </div>

            <mat-paginator [length]="leadSourceDataListTotalRecords" [pageSize]="leadSourceItemsPerPage"
              [pageSizeOptions]="[5,10,20,50,100]" (page)="pageChangedTrscList($event)" showFirstLastButtons>
            </mat-paginator>
          </div>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>

<ng-template #leadSourceDetailsDialog let-dialogRef="dialogRef">
  <div class="dialog-container">
    <div class="dialog-header dialog-header-titleFont">
      View Lead Source Master
      <span>
        <a mat-icon-button href="javascript:void(0)" (click)="dialogRef.close()">
           <img src="assets/img/DashboardIcons/Reject.svg">
        </a>
      </span>
    </div>

    <div mat-dialog-content>
      <div class="col-md-12">
        <mat-card class="cardWithShadow">
          <mat-card-header>
            <mat-card-title class="f-w-600 f-s-15">Basic Details</mat-card-title>
          </mat-card-header>
          <mat-card-content class="matcard-content">
            <div class="row">
              <div class="col-lg-6 col-md-6 d-flex align-items-center">
                <label class="inputLabel mb-0">
                  Lead Source
                  <span class="m-6">:</span>
                </label>
                <span class="f-s-14">{{ viewTrscData.leadSourceName }}</span>
              </div>
              <div class="col-lg-6 col-md-6 d-flex align-items-center">
                <label class="inputLabel mb-0">
                  Status
                  <span class="m-6">:</span>
                </label>
                <span class="status-badge" [ngClass]="{
                'status-success': viewTrscData.status === 'Active',
                'status-danger': viewTrscData.status === 'Inactive'
                   }">
                  {{ viewTrscData.status }}
                </span>
              </div>
            </div>

          </mat-card-content>
        </mat-card>

        <mat-card *ngIf="viewTrscData.leadSubSourceDtoList?.length > 0" class="cardWithShadow">
          <mat-card-header>
            <mat-card-title class="f-w-600 f-s-15">Lead Sub Source Detail</mat-card-title>
          </mat-card-header>
          <mat-card-content>
            <div class="table-responsive table-container">
              <table mat-table [dataSource]="paginatedSubSources" class="w-100">
                <ng-container matColumnDef="subSourceName">
                  <th mat-header-cell *matHeaderCellDef class="inputLabel">Sub Source</th>
                  <td mat-cell *matCellDef="let element" class="f-s-14">{{ element.name }}</td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="subSourceDisplayedColumns; sticky: true" class="table-header-bg">
                </tr>
                <tr mat-row *matRowDef="let row; columns: subSourceDisplayedColumns; trackBy: trackBySubSourceId"
                  class="table-content-row"></tr>
              </table>

              <mat-paginator [length]="viewTrscData?.leadSubSourceDtoList?.length || 0"
                [pageSize]="leadSubSourceItemsPerPage" [pageSizeOptions]="[5,10,20,50,100]"
                (page)="pageChangedleadSubSourceOnView($event)" showFirstLastButtons>
              </mat-paginator>
            </div>
          </mat-card-content>
        </mat-card>

      </div>
    </div>
    <div mat-dialog-actions class="p-0 m-t-10 dialog-action-adjust">
      <button mat-stroked-button mat-dialog-close class="button-normal">Close</button>
    </div>
  </div>
</ng-template>
