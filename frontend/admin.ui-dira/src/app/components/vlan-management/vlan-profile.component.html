@if (isShowMenu) {
  <mat-tab-group [(selectedIndex)]="activeTabIndex" (selectedTabChange)="onTabChange($event)">
    <mat-tab label="Search VLAN Profile"></mat-tab>
    <mat-tab label="Bulk VLAN"></mat-tab>
    <mat-tab label="VLAN Audit"></mat-tab>
  </mat-tab-group>
  <div style="margin-top: 2rem"></div>
  <!-- The routed content will display here -->
  <router-outlet></router-outlet>
}
