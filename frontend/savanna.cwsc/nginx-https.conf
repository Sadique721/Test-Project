server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/certi/domain.crt;
    ssl_certificate_key /etc/certi/domain.key;

    root /usr/share/nginx/html;

    # Angular SPA Handler
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do NOT block env.js
    location /assets/env.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Prevent caching index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
