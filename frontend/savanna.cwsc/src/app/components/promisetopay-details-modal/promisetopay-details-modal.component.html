<div class="dialog-container">
  <!-- HEADER -->
  <div class="dialog-header">
    Promise To Pay Details
    <span>
      <a mat-icon-button mat-dialog-close (click)="dialogRef.close()">
        <img src="assets/img/DashboardIcons/Reject.svg" />
      </a>
    </span>
  </div>

  <!-- CONTENT -->
  <div mat-dialog-content>
    <mat-card style="margin-top: 2rem">
      <mat-card-content>
        <table class="table">
          <thead>
            <tr>
              <th>Start Date</th>
              <th>End Date</th>
              <th>Promise To Pay Days</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let plan of promiseToPayData">
              <td>{{ plan.startDate }}</td>
              <td>{{ plan.endDate }}</td>
              <td>{{ plan.days }}</td>
            </tr>
          </tbody>
        </table>
      </mat-card-content>
    </mat-card>
  </div>

  <!-- FOOTER -->
  <div class="dialog-action-adjust d-flex justify-content-end" style="gap: 8px">
    <button mat-stroked-button mat-dialog-close (click)="dialogRef.close()">Close</button>
  </div>
</div>
