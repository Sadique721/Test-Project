<mat-card style="margin-top: 2rem">
  <!-- <mat-card-header>
        <mat-card-title>Current Subscription</mat-card-title>
      </mat-card-header> -->
  <mat-card-content
    ><div class="row displayView">
      <!-- Time Frame -->
      <div class="col-lg-4 col-md-4 col-sm-6 col-xs-12">
        <mat-form-field
          appearance="outline"
          class="w-100 hide-hint mr-10"
          style="padding-left: 16px"
        >
          <mat-label>Time Frame</mat-label>
          <mat-select [(value)]="selectedTimeFrame">
            <mat-option *ngFor="let t of timeFrameOption" [value]="t.value">
              {{ t.label }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <!-- Date -->
      <div class="col-lg-4 col-md-4 col-sm-6 col-xs-12">
        <mat-form-field
          appearance="outline"
          class="w-100 hide-hint mr-10"
          style="padding-left: 16px"
        >
          <mat-label>Date</mat-label>
          <input
            matInput
            [matDatepicker]="picker"
            [(ngModel)]="selectedDate"
            [max]="maxDate"
            placeholder="Select Date"
          />
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
      </div>

      <!-- Buttons -->
      <div class="col-lg-4 col-md-4 col-sm-6 col-xs-12">
        <button
          mat-flat-button
          color="primary"
          class="button-normal m-r-10"
          style="width: fit-content"
          (click)="searchUsageHistory(5)"
          [disabled]="selectedTimeFrame === '' && selectedDate === ''"
        >
          Search Usage
        </button>

        <button
          mat-stroked-button
          matButton="outlined"
          class="button-normal"
          (click)="clearUsageSearch()"
        >
          Clear
        </button>
      </div>
    </div>
  </mat-card-content>
</mat-card>
<mat-card style="margin-top: 2rem">
  <mat-card-content>
    <div class="row">
      <div class="col-lg-12 col-md-12">
        <!-- Export Button -->
        <div class="mb-2">
          <!-- <button
            mat-icon-button
            color="primary"
            (click)="exportCurrentPlanToExcel()"
            [disabled]="!cdrListData"
            matTooltip="Export XLS"
          >
            <img
              src="assets/img/DashboardIcons/xls-file-svgrepo-com 1.svg"
              alt="pdf"
              style="width: 25px; height: 25px; border-radius: 3px"
            />
          </button> -->
        </div>

        <!-- Material Table -->
        <div class="example-container mat-elevation-z8" tabindex="0">
          <table mat-table [dataSource]="cdrListData" class="mat-elevation-z8">
            <!-- Dynamic Columns -->
            <ng-container *ngFor="let col of cols" [matColumnDef]="col.field">
              <th mat-header-cell *matHeaderCellDef class="f-w-600 table-header-title">
                {{ col.header }}
              </th>
              <td mat-cell *matCellDef="let element">
                {{ element[col.field] }}
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displaycolom"></tr>
            <tr mat-row *matRowDef="let row; columns: displaycolom"></tr>

            <!-- Empty Message -->
            <tr class="mat-row" *ngIf="cdrListData.length === 0">
              <td class="mat-cell">No Records found.</td>
            </tr>
          </table>
        </div>
        <!-- Pagination -->
        <mat-paginator
          [length]="cdrListDatatotalRecords"
          [pageSize]="usageDataitemsPerPage"
          [pageSizeOptions]="[5, 10, 20]"
          (page)="cdrDataPageChange($event)"
          showFirstLastButtons
        >
        </mat-paginator>
      </div>
    </div> </mat-card-content
></mat-card>
