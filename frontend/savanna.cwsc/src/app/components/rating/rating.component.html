<div class="tab-content-wrapper">
  <mat-card style="margin-top: 1.5rem">
    <mat-card-content>
      <form [formGroup]="ratingForm">
        <div class="row p-0 m-0">
          <!-- Rating -->
          <div class="col-lg-6 col-md-6 col-sm-6 col-xs-6">
            <label class="datalbl">Rating</label>
            <div class="d-flex justify-content-start align-items-center" style="margin-top: 1.5rem">
              <ngx-star-rating formControlName="rating" [id]="'rating'"></ngx-star-rating>
            </div>
            <div
              class="errorWrap text-danger"
              *ngIf="isRatingError && ratingForm.controls.rating.errors"
            >
              <div
                class="error text-danger"
                *ngIf="isRatingError && ratingForm.controls.rating.errors?.required"
              >
                Rating is required.
              </div>
            </div>
          </div>

          <!-- Feedback -->
          <div class="col-lg-6 col-md-6 col-sm-6 col-xs-6">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Feedback</mat-label>
              <textarea
                matInput
                rows="3"
                formControlName="feedback"
                [readonly]="!isEditRating && isRatingPresent"
                [ngClass]="{
                  'is-invalid':
                    ratingSubmmitted && ratingTicketForm.controls.customerFeedback?.errors
                }"
              ></textarea>
            </mat-form-field>
          </div>
        </div>
      </form>

      <!-- Buttons -->
      <div class="d-flex justify-contant-center">
        <div style="margin-top: 10px">
          <button
            mat-flat-button
            color="primary"
            style="margin: 3px"
            *ngIf="isEditRating"
            (click)="updateRating()"
          >
            Update
          </button>

          <button
            mat-flat-button
            color="primary"
            style="margin: 3px"
            *ngIf="!isEditRating && isRatingPresent"
            (click)="editRating()"
          >
            Edit
          </button>

          <button
            mat-flat-button
            color="primary"
            style="margin: 3px"
            *ngIf="!isRatingPresent"
            (click)="saveRating()"
          >
            Save
          </button>

          <button
            mat-stroked-button
            style="margin: 3px"
            *ngIf="isEditRating"
            (click)="cancelEditRating()"
          >
            Cancel
          </button>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
