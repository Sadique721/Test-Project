@if (mobileQuery.matches) {
  <div class="horizontal-sidebar p-y-8 p-y-8">
    <div class="container">
      <div class="horizontal-nav-wrapper">
        <button
          class="nav-scroll-btn nav-scroll-left"
          [disabled]="!canScrollLeft"
          (click)="scrollLeft()"
          [class.visible]="showScrollButtons"
        >
          <i class="pi pi-chevron-left"></i>
        </button>

        <div class="horizontal-navbar-container" #navContainer>
          <div class="horizontal-navbar hstack align-items-center" #navItemsContainer>
            @for (item of navItems; track $index) {
              <app-horizontal-nav-item
                [item]="item"
                class="parentBox {{ item.ddType }}"
                [ngClass]="{
                  pactive: isChildActive(item) ? 'pactive' : ''
                }"
              >
              </app-horizontal-nav-item>
            }
          </div>
        </div>

        <button
          class="nav-scroll-btn nav-scroll-right"
          [disabled]="!canScrollRight"
          (click)="scrollRight()"
          [class.visible]="showScrollButtons"
        >
          <i class="pi pi-chevron-right"></i>
        </button>
      </div>
    </div>
  </div>
}
