<div class="dialog-container">
  <!-- HEADER -->
  <div class="dialog-header">
    {{ planForConnection.planName }}
    <span>
      <a mat-icon-button mat-dialog-close (click)="dialogRef.close()">
        <img src="assets/img/DashboardIcons/Reject.svg" />
      </a>
    </span>
  </div>

  <!-- CONTENT -->
  <div mat-dialog-content>
    <mat-card style="margin-top: 2rem">
      <mat-card-content>
        <div class="row">
          <div class="col-lg-4 col-md-4 col-sm-6 col-xs-12 dataGroup">
            <label class="datalbl">Service :</label>
            <span>{{ planForConnection.service }}</span>
          </div>

          <div class="col-lg-4 col-md-4 col-sm-6 col-xs-12 dataGroup">
            <label class="datalbl">Connection No :</label>
            <span>{{ planForConnection.connection_no }}</span>
          </div>

          <div class="col-lg-4 col-md-4 col-sm-6 col-xs-12 dataGroup">
            <label class="datalbl">Nick Name :</label>
            <span>
              {{ planForConnection.nickname ? planForConnection.nickname : "-" }}
            </span>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <!-- FOOTER -->
  <div class="dialog-action-adjust d-flex justify-content-end" style="gap: 8px">
    <button mat-stroked-button mat-dialog-close (click)="dialogRef.close()">Close</button>
  </div>
</div>
